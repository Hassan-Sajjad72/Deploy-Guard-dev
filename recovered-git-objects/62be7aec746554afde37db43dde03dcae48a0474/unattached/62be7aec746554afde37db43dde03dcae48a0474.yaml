      TERRAFORM_STATE_USE_LOCKFILE: ${TERRAFORM_STATE_USE_LOCKFILE}

  normal-v1-infrastructure-apply-consumer:
    environment:
      BILLING_PROVIDER_ENABLED: "false"
      NOTIFICATION_DELIVERY_ENABLED: "false"
      TWO_LANE_CANARY_EXPECTED_AWS_ACCOUNT: ${TWO_LANE_CANARY_EXPECTED_AWS_ACCOUNT}
      TERRAFORM_STATE_BUCKET: ${TERRAFORM_STATE_BUCKET}
      TERRAFORM_STATE_REGION: ${TERRAFORM_STATE_REGION}
      TERRAFORM_STATE_PREFIX: ${TERRAFORM_STATE_PREFIX}
      TERRAFORM_STATE_USE_LOCKFILE: ${TERRAFORM_STATE_USE_LOCKFILE}
