services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on: [backend]
  backend:
    build: ./backend
    env_file: .env
    environment:
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 2s
      timeout: 2s
      retries: 30
