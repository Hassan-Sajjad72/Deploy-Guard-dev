global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: deployguard-aws-runtime
    metrics_path: /api/monitoring/metrics
    authorization:
      type: Bearer
      credentials: __DEPLOYGUARD_SCRAPE_TOKEN__
    static_configs:
      - targets:
          - __DEPLOYGUARD_SCRAPE_TARGET__
