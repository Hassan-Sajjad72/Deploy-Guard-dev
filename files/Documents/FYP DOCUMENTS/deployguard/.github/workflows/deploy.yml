name: DeployGuard CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  AWS_REGION:   ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECS_CLUSTER:  ${{ secrets.ECS_CLUSTER || 'deployguard-cluster' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: backend/package-lock.json }
      - run: cd backend && npm ci && npm test --if-present

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build & push backend
        env: { REGISTRY: "${{ steps.login-ecr.outputs.registry }}", TAG: "${{ github.sha }}" }
        run: |
          docker build -t $REGISTRY/deployguard-app:$TAG ./backend
          docker tag  $REGISTRY/deployguard-app:$TAG $REGISTRY/deployguard-app:latest
          docker push $REGISTRY/deployguard-app:$TAG
          docker push $REGISTRY/deployguard-app:latest
      - name: Build & push frontend
        env: { REGISTRY: "${{ steps.login-ecr.outputs.registry }}", TAG: "${{ github.sha }}" }
        run: |
          docker build -t $REGISTRY/deployguard-app:frontend-$TAG ./frontend
          docker tag  $REGISTRY/deployguard-app:frontend-$TAG $REGISTRY/deployguard-app:frontend-latest
          docker push $REGISTRY/deployguard-app:frontend-$TAG
          docker push $REGISTRY/deployguard-app:frontend-latest

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}
      - run: aws ecs update-service --cluster $ECS_CLUSTER --service deployguard-backend  --force-new-deployment
      - run: aws ecs update-service --cluster $ECS_CLUSTER --service deployguard-frontend --force-new-deployment
      - run: aws ecs wait services-stable --cluster $ECS_CLUSTER --services deployguard-backend deployguard-frontend
      - run: echo "Deployment complete!"
