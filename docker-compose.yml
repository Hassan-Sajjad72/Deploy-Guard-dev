services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mini_paas
      POSTGRES_USER: mini_paas_user
      POSTGRES_PASSWORD: mini_paas_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
