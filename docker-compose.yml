services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mini_paas
      POSTGRES_USER: mini_paas_user
      POSTGRES_PASSWORD: mini_paas_password
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
