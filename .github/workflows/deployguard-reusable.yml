name: DeployGuard Railpack release
# deployguard-result-contract: deployguard.release-result/v2

on:
  workflow_call:
    inputs:
      deployment_action: { required: true, type: string }
      deployment_operation_id: { required: true, type: string }
      project_id: { required: true, type: string }
      environment_name: { required: true, type: string }
      repository_full_name: { required: true, type: string }
      repository_branch: { required: true, type: string }
      commit_sha: { required: true, type: string }
      image_tag: { required: true, type: string }
      environment_references_base64: { required: true, type: string }
      managed_database_enabled: { required: true, type: string }
      infrastructure_namespace: { required: true, type: string }
      aws_region: { required: true, type: string }
      aws_role_arn: { required: true, type: string }
      vpc_id: { required: true, type: string }
      public_subnet_ids: { required: true, type: string }
      terraform_state_bucket: { required: true, type: string }
      platform_port: { required: true, type: string }
      rollback_image_digest: { required: false, type: string, default: "" }
      control_plane_sha: { required: true, type: string }
      result_contract_version: { required: true, type: string }

permissions:
  contents: read
  id-token: write

concurrency:
  group: deployguard-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      DEPLOYMENT_ACTION: ${{ inputs.deployment_action }}
      PROJECT_ID: ${{ inputs.project_id }}
      ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      OPERATION_ID: ${{ inputs.deployment_operation_id }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      PLATFORM_PORT: ${{ inputs.platform_port }}
      ENVIRONMENT_REFERENCES_BASE64: ${{ inputs.environment_references_base64 }}
      CONTROL_PLANE_SHA: ${{ inputs.control_plane_sha }}
      RESULT_CONTRACT_VERSION: ${{ inputs.result_contract_version }}
      VPC_ID: ${{ inputs.vpc_id }}
      PUBLIC_SUBNET_IDS: ${{ inputs.public_subnet_ids }}
      TERRAFORM_STATE_BUCKET: ${{ inputs.terraform_state_bucket }}
      ROLLBACK_IMAGE_DIGEST: ${{ inputs.rollback_image_digest }}
      BUILDKIT_CONTAINER: deployguard-buildkit-${{ inputs.deployment_operation_id }}
      RUNTIME_PROBE_CONTAINER: deployguard-runtime-probe-${{ inputs.deployment_operation_id }}
      BUILDKIT_IMAGE: moby/buildkit:v0.16.0@sha256:bc1fe18224dbcb92599139db0c745696c48ba9fd4ac24038d1fa81fdd7dcac27
    steps:
      - name: Checkout exact application source
        if: inputs.deployment_action == 'deploy'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
      - name: Validate immutable release input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_ACTION" =~ ^(deploy|rollback|destroy)$ ]] || { echo 'Invalid deployment action.' >&2; exit 1; }
          [[ "$PROJECT_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Invalid project identity.' >&2; exit 1; }
          [[ "$OPERATION_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Invalid operation identity.' >&2; exit 1; }
          [ "$RESULT_CONTRACT_VERSION" = deployguard.release-result/v2 ] || { echo 'Incompatible DeployGuard result contract.' >&2; exit 1; }
          [[ "$PLATFORM_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && [ "$PLATFORM_PORT" -le 65535 ] || { echo 'Invalid platform port.' >&2; exit 1; }
          if [ "$DEPLOYMENT_ACTION" = deploy ]; then [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || { echo 'Exact source SHA mismatch.' >&2; exit 1; }; fi
          if [ "$DEPLOYMENT_ACTION" = rollback ]; then [[ "$ROLLBACK_IMAGE_DIGEST" =~ @sha256:[0-9a-f]{64}$ ]] || { echo 'Rollback requires an immutable ECR image digest.' >&2; exit 1; }; fi
          printf '%s' "$ENVIRONMENT_REFERENCES_BASE64" | base64 --decode | jq -e --arg project "$PROJECT_ID" --arg operation "$OPERATION_ID" --arg sha "$SOURCE_SHA" --arg action "$DEPLOYMENT_ACTION" '
            .schemaVersion == 1 and .projectId == $project and .operationId == $operation and .sourceSha == $sha
            and (if $action == "destroy" then (.projectDeletion.generationIds | type == "array" and length > 0) else true end)
          ' >/dev/null
      - name: Install pinned Railpack
        if: success() && inputs.deployment_action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 'https://github.com/railwayapp/railpack/releases/download/v0.38.0/railpack-v0.38.0-x86_64-unknown-linux-musl.tar.gz' -o "$tmpdir/railpack.tgz"
          printf '%s  %s\n' '7c3f0e70ca8bf80bde87e8c30cb0171414c2b6bbd794d6f60a19cc3b71772950' "$tmpdir/railpack.tgz" | sha256sum --check --status
          tar -xzf "$tmpdir/railpack.tgz" -C "$tmpdir"
          install -m 0755 "$tmpdir/railpack" /usr/local/bin/railpack
          test ! -f /tmp/railpack
          railpack --version
      - name: Build immutable Railpack image
        if: success() && inputs.deployment_action == 'deploy'
        id: build
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          repository="deployguard-${PROJECT_ID}"
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image="${registry}/${repository}:${IMAGE_TAG}"
          docker version --format '{{.Server.Version}}' >/dev/null || { echo 'Railpack Build prerequisite failed: Docker is unavailable.' >&2; exit 1; }
          docker run --rm --privileged --detach --name "$BUILDKIT_CONTAINER" "$BUILDKIT_IMAGE" >/dev/null || { echo 'Railpack Build prerequisite failed: BuildKit could not start.' >&2; exit 1; }
          ready=false
          for attempt in {1..30}; do
            if docker exec "$BUILDKIT_CONTAINER" buildctl debug workers >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'Railpack Build prerequisite failed: BuildKit worker did not become ready.' >&2
            docker logs "$BUILDKIT_CONTAINER" --tail 100 >&2 || true
            exit 1
          fi
          BUILDKIT_HOST="docker-container://${BUILDKIT_CONTAINER}" railpack build --name "$image" .
          printf 'image=%s\nrepository=%s\nregistry=%s\n' "$image" "$repository" "$registry" >> "$GITHUB_OUTPUT"
      - name: Validate Application Runtime
        if: success() && inputs.deployment_action == 'deploy' && steps.build.outputs.image != ''
        shell: bash
        env:
          PROBE_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          image="$PROBE_IMAGE"
          cleanup_probe() {
            docker rm --force "$RUNTIME_PROBE_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT INT TERM
          cleanup_probe
          docker run --detach --name "$RUNTIME_PROBE_CONTAINER" --env PORT=8080 --env HOST=0.0.0.0 "$image" >/dev/null
          ready=false
          if timeout --signal=TERM 45 bash -c '
            while true; do
              running="$(docker inspect --format "{{.State.Running}}" "$RUNTIME_PROBE_CONTAINER" 2>/dev/null || true)"
              [ "$running" = true ] || exit 1
              container_ip="$(docker inspect --format "{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}" "$RUNTIME_PROBE_CONTAINER" 2>/dev/null || true)"
              if [ -n "$container_ip" ] && timeout 1 bash -c "exec 3<>/dev/tcp/\$1/8080" _ "$container_ip" 2>/dev/null; then exit 0; fi
              sleep 1
            done
          '; then ready=true; fi
          if [ "$ready" != true ]; then
            docker logs "$RUNTIME_PROBE_CONTAINER" --tail 100 2>&1 | tail -c 12000 >&2 || true
            echo 'Application did not listen on PORT=8080 within 45 seconds. Bind to 0.0.0.0 and use the PORT environment variable.' >&2
            exit 1
          fi
      - name: Publish immutable image to ECR
        if: success() && inputs.deployment_action == 'deploy' && steps.build.outputs.image != ''
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="${{ steps.build.outputs.repository }}"
          registry="${{ steps.build.outputs.registry }}"
          aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$repository" --image-tag-mutability IMMUTABLE >/dev/null
          image="${{ steps.build.outputs.image }}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker push "$image"
          digest="$(aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'ECR did not return an immutable image digest.' >&2; exit 1; }
          immutable_image="${registry}/${repository}@${digest}"
          printf 'image=%s\n' "$immutable_image" >> "$GITHUB_OUTPUT"
          printf 'image_uri=%s\nimage_digest=%s\n' "${registry}/${repository}" "$digest" >> "$GITHUB_OUTPUT"
      - name: Select immutable rollback image
        if: success() && inputs.deployment_action == 'rollback'
        id: rollback
        shell: bash
        run: |
          set -euo pipefail
          printf 'image=%s\n' "$ROLLBACK_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Install Terraform
        # Every valid lifecycle action can reach Materialize release runtime.
        # Keep setup unconditional after validation so a new runtime action
        # cannot reach `terraform` without this pinned installation.
        if: success()
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Materialize release runtime
        if: success() && (inputs.deployment_action == 'destroy' || inputs.deployment_action == 'rollback' || (inputs.deployment_action == 'deploy' && steps.image.outputs.image != ''))
        id: runtime
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image || steps.rollback.outputs.image || 'public.ecr.aws/docker/library/alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1' }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid control-plane SHA.' >&2; exit 1; }
          git init /tmp/deployguard-control-plane
          git -C /tmp/deployguard-control-plane remote add origin https://github.com/Hassan-Sajjad72/Deploy-Guard-dev.git
          git -C /tmp/deployguard-control-plane fetch --depth 1 origin "$CONTROL_PLANE_SHA"
          git -C /tmp/deployguard-control-plane checkout --detach "$CONTROL_PLANE_SHA"
          [ "$(git -C /tmp/deployguard-control-plane rev-parse HEAD)" = "$CONTROL_PLANE_SHA" ]
          mkdir -p .deployguard
          cp -R /tmp/deployguard-control-plane/infrastructure/railpack-runtime .deployguard/terraform
          printf '%s' "$ENVIRONMENT_REFERENCES_BASE64" | base64 --decode > .deployguard/runtime.json
          jq -n \
            --arg region "$AWS_REGION" --arg project "$PROJECT_ID" --arg operation "$OPERATION_ID" \
            --arg vpc "$VPC_ID" --arg image "$IMAGE" --argjson port "$PLATFORM_PORT" \
            --argjson subnets "$(printf '%s' "$PUBLIC_SUBNET_IDS" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')" \
            --slurpfile runtime .deployguard/runtime.json \
            '{region:$region,project_id:$project,operation_id:$operation,vpc_id:$vpc,public_subnet_ids:$subnets,image:$image,platform_port:$port,environment:($runtime[0].environment + {PORT:($port|tostring),HOST:"0.0.0.0"}),secret_references:$runtime[0].secretReferences,managed_database_enabled:$runtime[0].managedDatabase.enabled,managed_database_aliases:$runtime[0].managedDatabase.aliases,managed_database_engine:($runtime[0].managedDatabase.engine // "postgres")}' > .deployguard/terraform/terraform.tfvars.json
          terraform -chdir=.deployguard/terraform fmt -check
          terraform -chdir=.deployguard/terraform init -input=false -backend-config="bucket=$TERRAFORM_STATE_BUCKET" -backend-config="key=projects/$PROJECT_ID/$ENVIRONMENT_NAME/runtime/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="encrypt=true"
          terraform -chdir=.deployguard/terraform validate
          if [ "$DEPLOYMENT_ACTION" = destroy ]; then
            terraform -chdir=.deployguard/terraform destroy -input=false -auto-approve
            jq -n \
              --arg action "$DEPLOYMENT_ACTION" --arg contractVersion "$RESULT_CONTRACT_VERSION" --arg sourceSha "$SOURCE_SHA" --arg operationId "$OPERATION_ID" \
              --arg projectId "$PROJECT_ID" --arg environmentName "$ENVIRONMENT_NAME" \
              --slurpfile runtime .deployguard/runtime.json \
              '{
                action:$action,
                contractVersion:$contractVersion,
                sourceSha:$sourceSha,
                operationId:$operationId,
                destroyed:true,
                destroyVerification:{
                  contractVersion:"deployguard.destroy-result/v2",
                  deploymentOperationId:$operationId,
                  projectId:$projectId,
                  environmentName:$environmentName,
                  generationIds:($runtime[0].projectDeletion.generationIds | sort),
                  status:"project_delete_ready",
                  generationResourcesRemoved:true,
                  projectResourcesRemoved:true,
                  terraformStateArtifactsRemoved:true,
                  sharedPlatformUntouched:true,
                  verifiedAt:(now | todateiso8601)
                }
              }' > .deployguard/release-runtime.json
          else
            terraform -chdir=.deployguard/terraform plan -input=false -out=deployguard.tfplan
            terraform -chdir=.deployguard/terraform show -json deployguard.tfplan \
              | jq '
                  def redact($value; $mask):
                    if $mask == true then null
                    elif (($mask | type) == "object" and ($value | type) == "object") then
                      reduce ($value | keys_unsorted[]) as $key ({}; .[$key] = redact($value[$key]; ($mask[$key] // false)))
                    elif (($mask | type) == "array" and ($value | type) == "array") then
                      [range(0; $value | length) as $index | redact($value[$index]; ($mask[$index] // false))]
                    else $value end;
                  .resource_changes = ((.resource_changes // []) | map(
                    .change.before = redact(.change.before; (.change.before_sensitive // false))
                    | .change.after = redact(.change.after; (.change.after_sensitive // false))
                    | del(.change.before_sensitive, .change.after_sensitive)
                  ))
                ' > .deployguard/terraform/deployguard-cost-plan.json
            terraform -chdir=.deployguard/terraform apply -input=false -auto-approve deployguard.tfplan
            compact_project_id="${PROJECT_ID//-/}"
            service="dg-${compact_project_id:0:12}"
            aws ecs wait services-stable --cluster "$service" --services "$service"
            terraform -chdir=.deployguard/terraform output -json | jq -c 'with_entries(.value = .value.value)' > .deployguard/terraform-outputs.json
            alb_url="$(jq -r '.alb_url' .deployguard/terraform-outputs.json)"
            curl --fail --show-error --silent --retry 20 --retry-delay 3 --retry-connrefused "$alb_url" >/dev/null
            jq -n --arg action "$DEPLOYMENT_ACTION" --arg contractVersion "$RESULT_CONTRACT_VERSION" --arg sourceSha "$SOURCE_SHA" --arg operationId "$OPERATION_ID" --arg image "$IMAGE" --argjson terraform "$(cat .deployguard/terraform-outputs.json)" '{action:$action,contractVersion:$contractVersion,sourceSha:$sourceSha,operationId:$operationId,image:$image,terraform:$terraform}' > .deployguard/release-runtime.json
          fi
          mkdir -p terraform
          cp .deployguard/release-runtime.json terraform/deployguard-result.json
          if [ -f .deployguard/terraform/deployguard-cost-plan.json ]; then
            cp .deployguard/terraform/deployguard-cost-plan.json terraform/deployguard-cost-plan.json
          fi
      - name: Publish verified release result
        if: success() && hashFiles('terraform/deployguard-result.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployguard-result-${{ inputs.deployment_operation_id }}
          path: |
            terraform/deployguard-result.json
            terraform/deployguard-cost-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Clean up Railpack BuildKit daemon
        if: always() && inputs.deployment_action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          docker rm --force "$BUILDKIT_CONTAINER" >/dev/null 2>&1 || true
      - name: Clean up application runtime validation
        if: always() && inputs.deployment_action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          docker rm --force "$RUNTIME_PROBE_CONTAINER" >/dev/null 2>&1 || true
