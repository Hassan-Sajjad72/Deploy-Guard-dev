            REPOSITORY_INSTALL_ROOT="$(printf '%s' "$component" | jq -r '.repositoryInstallRoot')"
            DOCKERFILE_PATH="$(printf '%s' "$component" | jq -r 'if .dockerStrategy == "custom" then (.dockerfilePath // "Dockerfile") else "Dockerfile" end')"
            COMPONENT_TAG="${{ steps.release.outputs.image_tag }}-$COMPONENT_ID"
            TAGGED_URI="$REGISTRY/${{ steps.release.outputs.repository_name }}:$COMPONENT_TAG"
            case "$REPOSITORY_INSTALL_ROOT" in ""|/*|*".."*) echo "Invalid component repository install root." >&2; exit 1;; esac
