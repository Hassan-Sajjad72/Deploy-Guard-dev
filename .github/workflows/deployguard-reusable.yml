name: DeployGuard Railpack release

on:
  workflow_call:
    inputs:
      deployment_action: { required: true, type: string }
      deployment_operation_id: { required: true, type: string }
      project_id: { required: true, type: string }
      environment_name: { required: true, type: string }
      repository_full_name: { required: true, type: string }
      repository_branch: { required: true, type: string }
      commit_sha: { required: true, type: string }
      image_tag: { required: true, type: string }
      environment_references_base64: { required: true, type: string }
      managed_postgres_enabled: { required: true, type: string }
      infrastructure_namespace: { required: true, type: string }
      aws_region: { required: true, type: string }
      aws_role_arn: { required: true, type: string }
      vpc_id: { required: true, type: string }
      public_subnet_ids: { required: true, type: string }
      terraform_state_bucket: { required: true, type: string }
      platform_port: { required: true, type: string }
      rollback_image_digest: { required: false, type: string, default: "" }

permissions:
  contents: read
  id-token: write

concurrency:
  group: deployguard-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      DEPLOYMENT_ACTION: ${{ inputs.deployment_action }}
      PROJECT_ID: ${{ inputs.project_id }}
      OPERATION_ID: ${{ inputs.deployment_operation_id }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      PLATFORM_PORT: ${{ inputs.platform_port }}
      ENVIRONMENT_REFERENCES_BASE64: ${{ inputs.environment_references_base64 }}
    steps:
      - name: Checkout exact application source
        if: inputs.deployment_action == 'deploy'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@0a3a7f8c8f8b37f3c7d2b23fe4cdd20b3b8a2746 # v4.0.2
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
      - name: Validate immutable release input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_ACTION" =~ ^(deploy|rollback|destroy)$ ]] || { echo 'Invalid deployment action.' >&2; exit 1; }
          [[ "$PROJECT_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Invalid project identity.' >&2; exit 1; }
          [[ "$OPERATION_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Invalid operation identity.' >&2; exit 1; }
          [[ "$PLATFORM_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && [ "$PLATFORM_PORT" -le 65535 ] || { echo 'Invalid platform port.' >&2; exit 1; }
          if [ "$DEPLOYMENT_ACTION" = deploy ]; then [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || { echo 'Exact source SHA mismatch.' >&2; exit 1; }; fi
          printf '%s' "$ENVIRONMENT_REFERENCES_BASE64" | base64 --decode | jq -e --arg project "$PROJECT_ID" --arg operation "$OPERATION_ID" --arg sha "$SOURCE_SHA" '.schemaVersion == 1 and .projectId == $project and .operationId == $operation and .sourceSha == $sha' >/dev/null
      - name: Install pinned Railpack
        if: inputs.deployment_action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 'https://github.com/railwayapp/railpack/releases/download/v0.38.0/railpack-v0.38.0-x86_64-unknown-linux-musl.tar.gz' -o /tmp/railpack.tgz
          echo '7c3f0e70ca8bf80bde87e8c30cb0171414c2b6bbd794d6f60a19cc3b71772950  /tmp/railpack.tgz' | sha256sum --check --status
          tar -xzf /tmp/railpack.tgz -C /tmp
          install -m 0755 /tmp/railpack /usr/local/bin/railpack
          railpack --version
      - name: Build and push immutable Railpack image
        if: inputs.deployment_action == 'deploy'
        id: image
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          repository="deployguard-${PROJECT_ID}"
          aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$repository" --image-tag-mutability IMMUTABLE >/dev/null
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image="${registry}/${repository}:${IMAGE_TAG}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          railpack build --name "$image" .
          docker push "$image"
          digest="$(aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'ECR did not return an immutable image digest.' >&2; exit 1; }
          immutable_image="${registry}/${repository}@${digest}"
          printf 'image=%s\n' "$immutable_image" >> "$GITHUB_OUTPUT"
          printf 'DEPLOYGUARD_RELEASE_ARTIFACT={"sourceSha":"%s","imageUri":"%s","imageDigest":"%s"}\n' "$SOURCE_SHA" "${registry}/${repository}" "$digest"
