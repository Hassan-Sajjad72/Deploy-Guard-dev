name: DeployGuard reusable AWS deployment

on:
  workflow_call:
    inputs:
      deployment_action: { required: true, type: string }
      deployment_operation_id: { required: true, type: string }
      project_id: { required: true, type: string }
      environment_name: { required: true, type: string }
      repository_full_name: { required: true, type: string }
      repository_branch: { required: true, type: string }
      detection_profile_version: { required: true, type: string }
      deployment_contract_version: { required: true, type: string }
      image_tag: { required: true, type: string }
      environment_references_base64: { required: true, type: string }
      infrastructure_namespace: { required: true, type: string }
      aws_region: { required: true, type: string }
      aws_role_arn: { required: true, type: string }
      vpc_id: { required: true, type: string }
      public_subnet_ids: { required: true, type: string }
      commit_sha: { required: true, type: string }
      application_root: { required: true, type: string }
      app_port: { required: true, type: number }
      health_check_path: { required: true, type: string }
      terraform_state_bucket: { required: true, type: string }
      container_profile: { required: true, type: string }
      output_directory: { required: true, type: string }
      generated_dockerfile_base64: { required: false, type: string, default: "" }
      build_time_public_config_base64: { required: false, type: string, default: "" }

permissions:
  contents: read
  id-token: write

concurrency:
  group: deployguard-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      PROJECT_ID: ${{ inputs.project_id }}
      ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      OPERATION_ID: ${{ inputs.deployment_operation_id }}
      DEPLOYMENT_ACTION: ${{ inputs.deployment_action }}
      APP_PORT: ${{ inputs.app_port }}
      HEALTH_CHECK_PATH: ${{ inputs.health_check_path }}
      VPC_ID: ${{ inputs.vpc_id }}
      PUBLIC_SUBNET_IDS: ${{ inputs.public_subnet_ids }}
      TERRAFORM_STATE_BUCKET: ${{ inputs.terraform_state_bucket }}
      CONTAINER_PROFILE: ${{ inputs.container_profile }}
      OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
      APPLICATION_ROOT: ${{ inputs.application_root }}
      GENERATED_DOCKERFILE_BASE64: ${{ inputs.generated_dockerfile_base64 }}
      BUILD_TIME_PUBLIC_CONFIG_BASE64: ${{ inputs.build_time_public_config_base64 }}
      ENVIRONMENT_REFERENCES_BASE64: ${{ inputs.environment_references_base64 }}
      INFRASTRUCTURE_NAMESPACE: ${{ inputs.infrastructure_namespace }}
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Validate immutable operation contract
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = "${{ inputs.repository_full_name }}" ] || { echo "Immutable repository identity mismatch." >&2; exit 1; }
          [ "$GITHUB_REF_NAME" = "${{ inputs.repository_branch }}" ] || { echo "Immutable branch identity mismatch." >&2; exit 1; }
          [ "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}" ] || { echo "Immutable commit identity mismatch." >&2; exit 1; }
          [[ "$ENVIRONMENT_NAME" =~ ^(dev|production)$ ]] || { echo "Invalid immutable environment." >&2; exit 1; }
          [ "$INFRASTRUCTURE_NAMESPACE" = "/deployguard/$PROJECT_ID" ] || { echo "Invalid infrastructure namespace." >&2; exit 1; }
          [[ "${{ inputs.image_tag }}" =~ ^[0-9a-f]{12}-[A-Za-z0-9]{12}$ ]] || { echo "Invalid immutable image tag." >&2; exit 1; }
          [ -n "${{ inputs.detection_profile_version }}" ] && [ -n "${{ inputs.deployment_contract_version }}" ] || { echo "Immutable contract version is missing." >&2; exit 1; }
          printf '%s' "$ENVIRONMENT_REFERENCES_BASE64" | base64 --decode | jq -e 'type == "object" and (.public | type == "array") and all(.public[]; type == "string") and (.secret | type == "array") and all(.secret[]; type == "string") and (.configurationFingerprint | type == "string")' >/dev/null || { echo "Invalid immutable environment references." >&2; exit 1; }

      - name: Derive immutable release identity
        if: inputs.deployment_action == 'deploy'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${{ inputs.commit_sha }}"
          SHORT_SHA="${SHORT_SHA::12}"
          OPERATION_SUFFIX="$(printf '%s' "$OPERATION_ID" | tr -cd '[:alnum:]' | cut -c1-12)"
          SAFE_PROJECT="$(printf '%s' "$PROJECT_ID" | tr '[:upper:]_' '[:lower:]-' | tr -cd 'a-z0-9-' | cut -c1-28)"
          REPOSITORY_NAME="deployguard-${SAFE_PROJECT}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          [ "${{ inputs.image_tag }}" = "${SHORT_SHA}-${OPERATION_SUFFIX}" ] || { echo "Immutable image tag does not match this operation." >&2; exit 1; }
          echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "repository_name=$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository
        if: inputs.deployment_action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY_NAME="${{ steps.release.outputs.repository_name }}"
          ERROR_FILE="$(mktemp)"
          if REPOSITORY="$(aws ecr describe-repositories --repository-names "$REPOSITORY_NAME" --output json 2>"$ERROR_FILE")"; then
            REPOSITORY_ARN="$(printf '%s' "$REPOSITORY" | jq -r '.repositories | if length == 1 then .[0].repositoryArn else empty end')"
          elif grep -q 'RepositoryNotFoundException' "$ERROR_FILE"; then
            REPOSITORY="$(aws ecr create-repository --repository-name "$REPOSITORY_NAME" --image-scanning-configuration scanOnPush=false \
              --tags Key=ManagedBy,Value=DeployGuard Key=DeployGuardProjectId,Value="$PROJECT_ID" Key=Environment,Value="$ENVIRONMENT_NAME" --output json)"
            REPOSITORY_ARN="$(printf '%s' "$REPOSITORY" | jq -r '.repository.repositoryArn // empty')"
          else
            echo "The project image repository could not be verified." >&2
            exit 1
          fi
          [ -n "$REPOSITORY_ARN" ] || { echo "The project image repository identity is ambiguous." >&2; exit 1; }
          TAGS="$(aws ecr list-tags-for-resource --resource-arn "$REPOSITORY_ARN" --output json)"
          printf '%s' "$TAGS" | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" '
            (.tags | map({key: .Key, value: .Value}) | from_entries) as $tags
            | $tags.ManagedBy == "DeployGuard"
              and $tags.DeployGuardProjectId == $project
              and $tags.Environment == $environment
          ' >/dev/null || { echo "The project image repository failed DeployGuard ownership verification." >&2; exit 1; }

      - name: Materialize immutable container contract
        if: inputs.deployment_action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          case "$APPLICATION_ROOT" in ""|/*|*".."*) echo "Invalid application root." >&2; exit 1;; esac
          APPLICATION_DIRECTORY="$GITHUB_WORKSPACE/$APPLICATION_ROOT"
          [ -d "$APPLICATION_DIRECTORY" ] || { echo "Contract application root does not exist." >&2; exit 1; }
          cd "$APPLICATION_DIRECTORY"
          if [ -n "$GENERATED_DOCKERFILE_BASE64" ]; then
            [ ! -e Dockerfile ] || { echo "Generated strategy cannot overwrite a repository Dockerfile." >&2; exit 1; }
            printf '%s' "$GENERATED_DOCKERFILE_BASE64" | base64 --decode > Dockerfile
            [ -s Dockerfile ] || { echo "Generated Dockerfile payload is empty." >&2; exit 1; }
          elif [ ! -f Dockerfile ]; then
            echo "Deployment contract supplied neither a generated nor repository Dockerfile." >&2
            exit 1
          fi
          grep -q '${{ inputs.commit_sha }}' Dockerfile || [ -z "$GENERATED_DOCKERFILE_BASE64" ] || { echo "Generated Dockerfile does not match the immutable commit contract." >&2; exit 1; }
          cat > .dockerignore <<'DOCKERIGNORE'
          .git
          .github
          .env
          .env.*
          node_modules
          __pycache__
          .pytest_cache
          .venv
          .deployguard
          DOCKERIGNORE

      - name: Build and push immutable image
        if: inputs.deployment_action == 'deploy'
        id: image
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          IMAGE_URI="$REGISTRY/${{ steps.release.outputs.repository_name }}:${{ steps.release.outputs.image_tag }}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          APPLICATION_DIRECTORY="$GITHUB_WORKSPACE/$APPLICATION_ROOT"
          cd "$APPLICATION_DIRECTORY"
          BUILD_ARGS=()
          if [ -n "$BUILD_TIME_PUBLIC_CONFIG_BASE64" ]; then
            CONFIG_FILE="$(mktemp)"
            trap 'rm -f "$CONFIG_FILE"' EXIT
            printf '%s' "$BUILD_TIME_PUBLIC_CONFIG_BASE64" | base64 --decode > "$CONFIG_FILE"
            jq -e 'type == "object" and all(keys[]; test("^(VITE_|NEXT_PUBLIC_|REACT_APP_)[A-Z0-9_]*$")) and all(.[]; type == "string")' "$CONFIG_FILE" >/dev/null || { echo "Invalid public build configuration payload." >&2; exit 1; }
            while IFS= read -r key; do
              value="$(jq -r --arg key "$key" '.[$key]' "$CONFIG_FILE")"
              BUILD_ARGS+=(--build-arg "$key=$value")
            done < <(jq -r 'keys[]' "$CONFIG_FILE")
          fi
          docker build --pull "${BUILD_ARGS[@]}" -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          IMAGE_DIGEST="$(aws ecr describe-images --repository-name "${{ steps.release.outputs.repository_name }}" --image-ids imageTag="${{ steps.release.outputs.image_tag }}" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "The immutable image digest could not be resolved." >&2; exit 1; }
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "uri=$REGISTRY/${{ steps.release.outputs.repository_name }}@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Generate deployment Terraform
        shell: bash
        env:
          IMAGE_URI: ${{ inputs.deployment_action == 'deploy' && steps.image.outputs.uri || 'destroy.invalid' }}
        run: |
          set -euo pipefail
          mkdir -p .deployguard/terraform
          cat > .deployguard/terraform/main.tf <<'TERRAFORM'
          terraform {
            backend "s3" {}
            required_providers {
              aws = { source = "hashicorp/aws", version = "~> 5.0" }
            }
          }
          provider "aws" { region = var.aws_region }
          variable "aws_region" { type = string }
          variable "project_id" { type = string }
          variable "environment_name" { type = string }
          variable "infrastructure_namespace" { type = string }
          variable "vpc_id" { type = string }
          variable "public_subnet_ids" { type = list(string) }
          variable "app_port" { type = number }
          variable "health_check_path" { type = string }
          variable "image_uri" { type = string }
          locals { name = substr("dg-${replace(lower(var.project_id), "_", "-")}", 0, 28) }
          locals {
            log_group_prefix = var.infrastructure_namespace
            ownership_tags = {
              ManagedBy            = "DeployGuard"
              DeployGuardProjectId = var.project_id
              Environment          = var.environment_name
            }
          }
          resource "aws_cloudwatch_log_group" "app" {
            name              = "${local.log_group_prefix}/app"
            retention_in_days = 14
            tags              = merge(local.ownership_tags, { LogPurpose = "app" })
          }
          resource "aws_cloudwatch_log_group" "database" {
            name              = "${local.log_group_prefix}/database"
            retention_in_days = 14
            tags              = merge(local.ownership_tags, { LogPurpose = "database" })
          }
          resource "aws_cloudwatch_log_group" "deployment" {
            name              = "${local.log_group_prefix}/deployment"
            retention_in_days = 14
            tags              = merge(local.ownership_tags, { LogPurpose = "deployment" })
          }
          resource "aws_security_group" "alb" {
            name   = "${local.name}-alb"
            vpc_id = var.vpc_id
            tags   = local.ownership_tags
            ingress {
              from_port   = 80
              to_port     = 80
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }
            egress {
              from_port   = 0
              to_port     = 0
              protocol    = "-1"
              cidr_blocks = ["0.0.0.0/0"]
            }
          }
          resource "aws_security_group" "service" {
            name   = "${local.name}-svc"
            vpc_id = var.vpc_id
            tags   = local.ownership_tags
            ingress {
              from_port       = var.app_port
              to_port         = var.app_port
              protocol        = "tcp"
              security_groups = [aws_security_group.alb.id]
            }
            egress {
              from_port   = 0
              to_port     = 0
              protocol    = "-1"
              cidr_blocks = ["0.0.0.0/0"]
            }
          }
          resource "aws_lb" "app" {
            name               = local.name
            internal           = false
            load_balancer_type = "application"
            security_groups    = [aws_security_group.alb.id]
            subnets            = var.public_subnet_ids
            tags               = local.ownership_tags
          }
          resource "aws_lb_target_group" "app" {
            name_prefix = substr(local.name, 0, 6)
            port        = var.app_port
            protocol    = "HTTP"
            vpc_id      = var.vpc_id
            target_type = "ip"
            tags        = merge(local.ownership_tags, { DeployGuardResource = "app-target-group" })
            lifecycle { create_before_destroy = true }
            health_check {
              path                = var.health_check_path
              matcher             = "200-399"
              interval            = 30
              timeout             = 10
              healthy_threshold   = 2
              unhealthy_threshold = 3
            }
          }
          resource "aws_lb_listener" "http" {
            load_balancer_arn = aws_lb.app.arn
            port              = 80
            protocol          = "HTTP"
            default_action {
              type             = "forward"
              target_group_arn = aws_lb_target_group.app.arn
            }
          }
          resource "aws_ecs_cluster" "app" {
            name = local.name
            tags = local.ownership_tags
          }
          resource "aws_iam_role" "execution" {
            name               = "${local.name}-execution"
            assume_role_policy = jsonencode({ Version = "2012-10-17", Statement = [{ Effect = "Allow", Principal = { Service = "ecs-tasks.amazonaws.com" }, Action = "sts:AssumeRole" }] })
            tags               = local.ownership_tags
          }
          resource "aws_iam_role_policy" "execution" {
            name = "ecr-pull"
            role = aws_iam_role.execution.id
            policy = jsonencode({ Version = "2012-10-17", Statement = [
              { Effect = "Allow", Action = ["ecr:GetAuthorizationToken", "ecr:BatchCheckLayerAvailability", "ecr:GetDownloadUrlForLayer", "ecr:BatchGetImage"], Resource = "*" },
              { Effect = "Allow", Action = ["logs:CreateLogStream", "logs:PutLogEvents", "logs:DescribeLogStreams"], Resource = [
                "${aws_cloudwatch_log_group.app.arn}:*",
                "${aws_cloudwatch_log_group.database.arn}:*",
                "${aws_cloudwatch_log_group.deployment.arn}:*"
              ] }
            ] })
          }
          resource "aws_ecs_task_definition" "app" {
            family                   = local.name
            network_mode             = "awsvpc"
            requires_compatibilities = ["FARGATE"]
            cpu                      = "1024"
            memory                   = "2048"
            execution_role_arn       = aws_iam_role.execution.arn
            tags                     = local.ownership_tags
            container_definitions = jsonencode([{
              name         = "app"
              image        = var.image_uri
              essential    = true
              environment  = [{ name = "PORT", value = tostring(var.app_port) }, { name = "HOST", value = "0.0.0.0" }]
              portMappings = [{ containerPort = var.app_port, hostPort = var.app_port, protocol = "tcp" }]
              logConfiguration = { logDriver = "awslogs", options = {
                awslogs-group         = aws_cloudwatch_log_group.app.name
                awslogs-region        = var.aws_region
                awslogs-stream-prefix = "ecs"
              } }
            }])
          }
          resource "aws_ecs_service" "app" {
            name                  = local.name
            cluster               = aws_ecs_cluster.app.id
            task_definition       = aws_ecs_task_definition.app.arn
            desired_count         = 1
            launch_type           = "FARGATE"
            wait_for_steady_state = true
            tags                  = local.ownership_tags
            network_configuration {
              subnets          = var.public_subnet_ids
              security_groups  = [aws_security_group.service.id]
              assign_public_ip = true
            }
            load_balancer {
              target_group_arn = aws_lb_target_group.app.arn
              container_name   = "app"
              container_port   = var.app_port
            }
            depends_on = [aws_lb_listener.http, aws_iam_role_policy.execution]
          }
          output "deployed_url" { value = "http://${aws_lb.app.dns_name}" }
          output "cluster_name" { value = aws_ecs_cluster.app.name }
          output "service_name" { value = aws_ecs_service.app.name }

          TERRAFORM
          cat > .deployguard/terraform/terraform.tfvars.json <<EOF
          {"aws_region":"$AWS_REGION","project_id":"$PROJECT_ID","environment_name":"$ENVIRONMENT_NAME","infrastructure_namespace":"$INFRASTRUCTURE_NAMESPACE","vpc_id":"$VPC_ID","public_subnet_ids":["${PUBLIC_SUBNET_IDS//,/\",\"}"],"app_port":$APP_PORT,"health_check_path":"$HEALTH_CHECK_PATH","image_uri":"$IMAGE_URI"}
          EOF

      - name: Terraform plan and apply
        working-directory: .deployguard/terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive -diff
          terraform init -input=false \
            -backend-config="bucket=$TERRAFORM_STATE_BUCKET" \
            -backend-config="key=projects/$PROJECT_ID/$ENVIRONMENT_NAME/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true"
          reconcile_log_group() {
            local purpose="$1"
            local address="aws_cloudwatch_log_group.$purpose"
            local name="$INFRASTRUCTURE_NAMESPACE/$purpose"
            local account_id arn tags error_file
            account_id="$(aws sts get-caller-identity --query Account --output text)"
            arn="arn:aws:logs:$AWS_REGION:$account_id:log-group:$name"
            error_file="$(mktemp)"
            if ! tags="$(aws logs list-tags-for-resource --resource-arn "$arn" --query tags --output json 2>"$error_file")"; then
              if grep -q 'ResourceNotFoundException' "$error_file"; then rm -f "$error_file"; return 0; fi
              rm -f "$error_file"
              echo "CloudWatch log group $name could not be verified." >&2
              exit 1
            fi
            rm -f "$error_file"
            printf '%s' "$tags" | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" --arg purpose "$purpose" \
              '.ManagedBy == "DeployGuard" and .DeployGuardProjectId == $project and .Environment == $environment and .LogPurpose == $purpose' >/dev/null || {
                echo "CloudWatch log group $name failed DeployGuard ownership verification." >&2
                exit 1
              }
            if ! terraform state list 2>/dev/null | grep -Fqx "$address"; then
              terraform import -input=false "$address" "$name" >/dev/null
            fi
          }
          reconcile_log_group app
          reconcile_log_group database
          reconcile_log_group deployment
          state_has() {
            terraform state list 2>/dev/null | grep -Fqx "$1"
          }
          verify_owned_tags() {
            local tags="$1"
            printf '%s' "$tags" | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" '
              map({key: (.key // .Key), value: (.value // .Value)}) | from_entries
              | .ManagedBy == "DeployGuard"
                and .DeployGuardProjectId == $project
                and .Environment == $environment
            ' >/dev/null
          }
          RESOURCE_NAME="dg-$(printf '%s' "$PROJECT_ID" | tr '[:upper:]_' '[:lower:]-' | cut -c1-25)"
          reconcile_security_group() {
            local address="$1" name="$2" result count identifier
            state_has "$address" && return 0
            result="$(aws ec2 describe-security-groups --filters "Name=group-name,Values=$name" "Name=vpc-id,Values=$VPC_ID" --output json)"
            count="$(printf '%s' "$result" | jq '.SecurityGroups | length')"
            [ "$count" -eq 0 ] && return 0
            [ "$count" -eq 1 ] || { echo "Existing security-group identity is ambiguous." >&2; exit 1; }
            verify_owned_tags "$(printf '%s' "$result" | jq -c '.SecurityGroups[0].Tags // []')" || { echo "Existing security group failed DeployGuard ownership verification." >&2; exit 1; }
            identifier="$(printf '%s' "$result" | jq -r '.SecurityGroups[0].GroupId')"
            terraform import -input=false "$address" "$identifier" >/dev/null
          }
          reconcile_ecs_cluster() {
            local result count arn
            state_has "aws_ecs_cluster.app" && return 0
            result="$(aws ecs describe-clusters --clusters "$RESOURCE_NAME" --include TAGS --output json)"
            count="$(printf '%s' "$result" | jq '[.clusters[]? | select(.status == "ACTIVE")] | length')"
            [ "$count" -eq 0 ] && return 0
            [ "$count" -eq 1 ] || { echo "Existing ECS cluster identity is ambiguous." >&2; exit 1; }
            verify_owned_tags "$(printf '%s' "$result" | jq -c '.clusters[0].tags // []')" || { echo "Existing ECS cluster failed DeployGuard ownership verification." >&2; exit 1; }
            arn="$(printf '%s' "$result" | jq -r '.clusters[0].clusterArn')"
            terraform import -input=false "aws_ecs_cluster.app" "$arn" >/dev/null
          }
          reconcile_ecs_service() {
            local result count
            state_has "aws_ecs_service.app" && return 0
            result="$(aws ecs describe-services --cluster "$RESOURCE_NAME" --services "$RESOURCE_NAME" --include TAGS --output json)"
            count="$(printf '%s' "$result" | jq '[.services[]? | select(.status == "ACTIVE")] | length')"
            [ "$count" -eq 0 ] && return 0
            [ "$count" -eq 1 ] || { echo "Existing ECS service identity is ambiguous." >&2; exit 1; }
            verify_owned_tags "$(printf '%s' "$result" | jq -c '.services[0].tags // []')" || { echo "Existing ECS service failed DeployGuard ownership verification." >&2; exit 1; }
            terraform import -input=false "aws_ecs_service.app" "$RESOURCE_NAME/$RESOURCE_NAME" >/dev/null
          }
          reconcile_load_balancer() {
            local address="aws_lb.app" result arn tags error_file
            state_has "$address" && return 0
            error_file="$(mktemp)"
            if ! result="$(aws elbv2 describe-load-balancers --names "$RESOURCE_NAME" --output json 2>"$error_file")"; then
              if grep -q 'LoadBalancerNotFound' "$error_file"; then return 0; fi
              echo "Existing load balancer could not be verified." >&2
              exit 1
            fi
            [ "$(printf '%s' "$result" | jq '.LoadBalancers | length')" -eq 1 ] || { echo "Existing load-balancer identity is ambiguous." >&2; exit 1; }
            arn="$(printf '%s' "$result" | jq -r '.LoadBalancers[0].LoadBalancerArn')"
            tags="$(aws elbv2 describe-tags --resource-arns "$arn" --output json | jq -c '.TagDescriptions[0].Tags // []')"
            verify_owned_tags "$tags" || { echo "Existing load balancer failed DeployGuard ownership verification." >&2; exit 1; }
            terraform import -input=false "$address" "$arn" >/dev/null
          }
          reconcile_execution_role() {
            local address="aws_iam_role.execution" name="$RESOURCE_NAME-execution" result tags error_file
            state_has "$address" && return 0
            error_file="$(mktemp)"
            if ! result="$(aws iam get-role --role-name "$name" --output json 2>"$error_file")"; then
              if grep -q 'NoSuchEntity' "$error_file"; then return 0; fi
              echo "Existing execution role could not be verified." >&2
              exit 1
            fi
            tags="$(printf '%s' "$result" | jq -c '.Role.Tags // []')"
            verify_owned_tags "$tags" || { echo "Existing execution role failed DeployGuard ownership verification." >&2; exit 1; }
            terraform import -input=false "$address" "$name" >/dev/null
          }
          reconcile_security_group "aws_security_group.alb" "$RESOURCE_NAME-alb"
          reconcile_security_group "aws_security_group.service" "$RESOURCE_NAME-svc"
          reconcile_ecs_cluster
          reconcile_load_balancer
          reconcile_execution_role
          reconcile_ecs_service
          terraform validate -no-color
          set +e
          if [ "$DEPLOYMENT_ACTION" = "destroy" ]; then
            terraform plan -destroy -detailed-exitcode -input=false -no-color -out=deployguard.tfplan
          else
            terraform plan -detailed-exitcode -input=false -no-color -out=deployguard.tfplan
          fi
          PLAN_EXIT_CODE="$?"
          set -e
          [ "$PLAN_EXIT_CODE" -eq 0 ] || [ "$PLAN_EXIT_CODE" -eq 2 ] || { echo "Terraform planning failed before apply." >&2; exit "$PLAN_EXIT_CODE"; }
          terraform show -json deployguard.tfplan > deployguard-plan.json
          jq -c '
            reduce (.resource_changes[]? | {type: .type, actions: (.change.actions // [])}) as $change
              ({create:0,update:0,replace:0,delete:0,noOp:0,resourceTypes:[]};
                .resourceTypes += [$change.type]
                | if (($change.actions | index("create")) and ($change.actions | index("delete"))) then .replace += 1
                  elif ($change.actions | index("create")) then .create += 1
                  elif ($change.actions | index("update")) then .update += 1
                  elif ($change.actions | index("delete")) then .delete += 1
                  else .noOp += 1 end)
            | .resourceTypes |= (map(select(type == "string")) | unique | sort)
          ' deployguard-plan.json > deployguard-plan-summary.json
          if ! jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" --arg namespace "$INFRASTRUCTURE_NAMESPACE" '
            def actions: (.change.actions // []);
            def deletes: (actions | index("delete")) != null;
            def retained: (.type | test("^aws_secretsmanager_secret(_version)?$|^aws_efs_(file_system|access_point)$"));
            def owned_tags: (.change.after.tags // .change.before.tags // {});
            def wrong_owner:
              owned_tags.ManagedBy == "DeployGuard"
              and (owned_tags.DeployGuardProjectId != $project or owned_tags.Environment != $environment);
            def cross_namespace:
              ((.change.after.name // .change.before.name // "") as $name
                | (($name | startswith("/deployguard/")) and ($name | startswith($namespace + "/") | not))
                  or (($name | startswith("deployguard/")) and ($name | startswith("deployguard/" + $project + "/" + $environment + "/") | not)));
            [ .resource_changes[]?
              | select(
                  (retained and deletes)
                  or (.type == "aws_cloudwatch_log_group" and deletes)
                  or wrong_owner
                  or cross_namespace
                )
              | {address, type, actions: (.change.actions // [])}
            ] | length == 0
          ' deployguard-plan.json >/dev/null; then
            echo "Terraform plan safety policy rejected an unexpected retained-resource or ownership change." >&2
            exit 1
          fi
          PLAN_SUMMARY="$(jq -c '. + {safety:"passed"}' deployguard-plan-summary.json)"
          printf 'DEPLOYGUARD_PLAN_SUMMARY=%s\n' "$PLAN_SUMMARY"
          terraform apply -input=false -auto-approve deployguard.tfplan

      - name: Remove immutable image repository after destroy
        if: inputs.deployment_action == 'destroy'
        shell: bash
        run: |
          set -euo pipefail
          SAFE_PROJECT="$(printf '%s' "$PROJECT_ID" | tr '[:upper:]_' '[:lower:]-' | tr -cd 'a-z0-9-' | cut -c1-28)"
          REPOSITORY_NAME="deployguard-${SAFE_PROJECT}"
          if ! ERROR="$(aws ecr delete-repository --repository-name "$REPOSITORY_NAME" --force 2>&1)"; then
            if printf '%s' "$ERROR" | grep -q 'RepositoryNotFoundException'; then
              exit 0
            fi
            echo "DeployGuard could not remove the project image repository." >&2
            exit 1
          fi

      - name: Verify ALB health and write result
        if: inputs.deployment_action == 'deploy'
        working-directory: .deployguard/terraform
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          URL="$(terraform output -raw deployed_url)"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "$URL$HEALTH_CHECK_PATH" >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo "ALB health verification failed" >&2; exit 1; fi
            sleep 10
          done
          URL="$URL" CLUSTER_NAME="$(terraform output -raw cluster_name)" SERVICE_NAME="$(terraform output -raw service_name)" \
            node -e 'const fs=require("fs");fs.writeFileSync("deployguard-result.json",JSON.stringify({deploymentOperationId:process.env.OPERATION_ID,status:"succeeded",deployedUrl:process.env.URL,imageUri:process.env.IMAGE_URI,imageDigest:process.env.IMAGE_DIGEST,commitSha:process.env.COMMIT_SHA,clusterName:process.env.CLUSTER_NAME,serviceName:process.env.SERVICE_NAME},null,2))'

      - name: Write destroy result
        if: inputs.deployment_action == 'destroy'
        working-directory: .deployguard/terraform
        shell: bash
        run: |
          COMMIT_SHA="${{ inputs.commit_sha }}" node -e 'const fs=require("fs");fs.writeFileSync("deployguard-result.json",JSON.stringify({deploymentOperationId:process.env.OPERATION_ID,status:"destroyed",commitSha:process.env.COMMIT_SHA},null,2))'

      - name: Upload DeployGuard result
        uses: actions/upload-artifact@v4
        with:
          name: deployguard-result-${{ inputs.deployment_operation_id }}
          path: .deployguard/terraform/deployguard-result.json
          retention-days: 30
