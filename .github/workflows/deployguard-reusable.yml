          trap cleanup_executable_preflight EXIT
          docker network create --internal "$NETWORK" >/dev/null
          PREFLIGHT_ENV_DIR="$ENV_DIR" node <<'NODE'
          const fs = require("fs");
          const runtime = JSON.parse(fs.readFileSync(".deployguard/runtime-config.json", "utf8"));
          const plan = JSON.parse(fs.readFileSync(".deployguard/build-plan.json", "utf8"));
          const database = runtime.managedDatabase;
          const password = "deployguard_preflight_password";
          for (const component of plan.components || []) {
            const componentRuntime = runtime.componentRuntime?.[component.id];
            if (!componentRuntime) throw new Error(`EXECUTABLE_PREFLIGHT_FAILED: runtime materialization is missing canonical component ${component.id}.`);
            const values = { ...(componentRuntime.environment || {}) };
            if (database && database.ownerComponentId === component.id) {
              const replacements = new Map([[String(database.host), "database"], [String(database.port), String(database.port)], [String(database.databaseName), String(database.databaseName)], [String(database.databaseUser), String(database.databaseUser)]]);
              for (const [key, value] of Object.entries(database.runtimeAliases || {})) values[key] = replacements.get(String(value)) || String(value);
              const url = `${database.urlScheme}://${encodeURIComponent(database.databaseUser)}:${encodeURIComponent(password)}@database:${database.port}/${database.databaseName}${database.urlQuery || ""}`;
              for (const [key, property] of Object.entries(database.secretAliases || {})) values[key] = property === "url" ? url : password;
            }
            for (const [name, reference] of Object.entries(componentRuntime.secretReferences || {})) {
              if (database?.ownerComponentId === component.id && database?.secretAliases?.[name]) continue;
              const segments = String(reference).split(":"); const field = segments.at(-3); const arn = segments.slice(0, -3).join(":");
              if (!field || !arn.startsWith("arn:")) throw new Error(`EXECUTABLE_PREFLIGHT_FAILED: immutable secret reference for ${name} is invalid.`);
              values[name] = `deployguard_preflight_${"7".repeat(64)}`;
            }
            const missing = (component.environmentOwnership || []).filter((item) => item?.componentId === component.id && item.required === true && item.phase === "runtime" && item.source !== "repository").map((item) => String(item.key || "")).filter((key) => key && values[key] === undefined);
            if (missing.length) throw new Error(`EXECUTABLE_PREFLIGHT_FAILED: missing required runtime configuration for ${component.id}: ${[...new Set(missing)].sort().join(", ")}.`);
            const file = `${process.env.PREFLIGHT_ENV_DIR}/${component.id}.env`; fs.writeFileSync(file, "", { mode: 0o600 });
            for (const [key, value] of Object.entries(values).sort(([a], [b]) => a.localeCompare(b))) { const rendered = String(value); if (/[\r\n\0]/.test(rendered)) throw new Error(`EXECUTABLE_PREFLIGHT_FAILED: ${key} cannot be represented safely.`); fs.appendFileSync(file, `${key}=${rendered}\n`, { mode: 0o600 }); }
          }
          NODE
          DATABASE_ENGINE="$(jq -r '.managedDatabase.engine // empty' .deployguard/runtime-config.json)"
          if [ -n "$DATABASE_ENGINE" ]; then
            DATABASE_NAME="$(jq -r '.managedDatabase.databaseName' .deployguard/runtime-config.json)"
            DATABASE_USER="$(jq -r '.managedDatabase.databaseUser' .deployguard/runtime-config.json)"
            case "$DATABASE_ENGINE" in
              postgres) DB_IMAGE="postgres:16"; DB_ARGS=(-e "POSTGRES_DB=$DATABASE_NAME" -e "POSTGRES_USER=$DATABASE_USER" -e "POSTGRES_PASSWORD=deployguard_preflight_password"); DB_HEALTH=(--health-cmd "pg_isready -U $DATABASE_USER -d $DATABASE_NAME");;
              mysql) DB_IMAGE="mysql:8"; DB_ARGS=(-e "MYSQL_DATABASE=$DATABASE_NAME" -e "MYSQL_USER=$DATABASE_USER" -e "MYSQL_PASSWORD=deployguard_preflight_password" -e "MYSQL_ROOT_PASSWORD=deployguard_preflight_password"); DB_HEALTH=(--health-cmd "mysqladmin ping -h 127.0.0.1 -u$DATABASE_USER -pdeployguard_preflight_password --silent");;
              mongodb) DB_IMAGE="mongo:8"; DB_ARGS=(-e "MONGO_INITDB_DATABASE=$DATABASE_NAME" -e "MONGO_INITDB_ROOT_USERNAME=$DATABASE_USER" -e "MONGO_INITDB_ROOT_PASSWORD=deployguard_preflight_password"); DB_HEALTH=(--health-cmd "mongosh --quiet --username '$DATABASE_USER' --password deployguard_preflight_password --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' >/dev/null");;
              *) echo "EXECUTABLE_PREFLIGHT_FAILED: unsupported managed database engine." >&2; exit 1;;
            esac
            DB_CONTAINER="$PREFLIGHT_ID-database"; CONTAINERS+=("$DB_CONTAINER")
            docker run -d --name "$DB_CONTAINER" --network "$NETWORK" --network-alias database "${DB_ARGS[@]}" "${DB_HEALTH[@]}" --health-interval 2s --health-timeout 5s --health-retries 30 "$DB_IMAGE" >/dev/null
            for attempt in $(seq 1 "$PREFLIGHT_ATTEMPTS"); do
              [ "$(docker inspect --format '{{.State.Health.Status}}' "$DB_CONTAINER" 2>/dev/null || true)" = "healthy" ] && break
              [ "$attempt" -lt "$PREFLIGHT_ATTEMPTS" ] || { echo "EXECUTABLE_PREFLIGHT_FAILED: managed database fixture did not become healthy." >&2; exit 1; }
              sleep 2
            done
          fi
          COMPONENTS="$(cat .deployguard/component-images.json)"
          while IFS= read -r image; do
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image" >/dev/null
            USER_VALUE="$(docker image inspect "$image" --format '{{.Config.User}}')"
            [ -n "$USER_VALUE" ] && [ "$USER_VALUE" != "0" ] && [ "$USER_VALUE" != "root" ] || { echo "EXECUTABLE_PREFLIGHT_FAILED: a final application image is configured to run as root." >&2; exit 1; }
          done < <(printf '%s' "$COMPONENTS" | jq -r '.[].imageUri')
          [ "$(printf '%s' "$COMPONENTS" | jq 'length')" -gt 0 ] || { echo "EXECUTABLE_PREFLIGHT_FAILED: immutable component set is empty." >&2; exit 1; }
          declare -A COMPONENT_CONTAINERS
          NAMESPACE_CONTAINER=""
          while IFS= read -r component; do
            COMPONENT_ID="$(printf '%s' "$component" | jq -r '.id')"; COMPONENT_IMAGE="$(printf '%s' "$component" | jq -r '.imageUri')"; COMPONENT_CONTAINER="$PREFLIGHT_ID-$COMPONENT_ID"
            CONTAINERS+=("$COMPONENT_CONTAINER"); COMPONENT_CONTAINERS["$COMPONENT_ID"]="$COMPONENT_CONTAINER"
            if [ -z "$NAMESPACE_CONTAINER" ]; then docker run -d --name "$COMPONENT_CONTAINER" --network "$NETWORK" --env-file "$ENV_DIR/$COMPONENT_ID.env" "$COMPONENT_IMAGE" >/dev/null; NAMESPACE_CONTAINER="$COMPONENT_CONTAINER"; else docker run -d --name "$COMPONENT_CONTAINER" --network "container:$NAMESPACE_CONTAINER" --env-file "$ENV_DIR/$COMPONENT_ID.env" "$COMPONENT_IMAGE" >/dev/null; fi
          done < <(printf '%s' "$COMPONENTS" | jq -c '.[]')
          check_component() {
            local component="$1" component_id container port mode path container_ip
            component_id="$(printf '%s' "$component" | jq -r '.id')"; container="${COMPONENT_CONTAINERS[$component_id]}"
            port="$(printf '%s' "$component" | jq -r '.port')"; mode="$(printf '%s' "$component" | jq -r '.healthCheckMode // "http"')"; path="$(printf '%s' "$component" | jq -r '.healthPath')"
            [ "$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null || true)" = "true" ] || { docker logs --tail 40 "$container" >&2 || true; echo "EXECUTABLE_PREFLIGHT_FAILED: component $component_id exited during startup." >&2; return 1; }
            container_ip="$(docker inspect --format "{{with index .NetworkSettings.Networks \"$NETWORK\"}}{{.IPAddress}}{{end}}" "$NAMESPACE_CONTAINER" 2>/dev/null || true)"
            if [ -z "$container_ip" ]; then
              docker logs --tail 40 "$container" >&2 || true
              echo "EXECUTABLE_PREFLIGHT_FAILED: component did not expose its immutable port contract and may have exited during startup." >&2
              return 1
            fi
            for attempt in $(seq 1 "$PREFLIGHT_ATTEMPTS"); do
              if (echo >"/dev/tcp/$container_ip/$port") >/dev/null 2>&1; then
                if [ "$mode" = "tcp" ] || curl --fail --silent --show-error --max-time 5 "http://$container_ip:$port$path" >/dev/null; then return 0; fi
              fi
              [ "$attempt" -lt "$PREFLIGHT_ATTEMPTS" ] || { docker logs --tail 40 "$container" >&2 || true; echo "EXECUTABLE_PREFLIGHT_FAILED: component failed startup/readiness on its immutable port contract." >&2; return 1; }
              sleep 2
            done
          }
          while IFS= read -r component; do check_component "$component"; done < <(printf '%s' "$COMPONENTS" | jq -c '.[]')
          BINDING_MOUNT="$(jq -r '.platformBackendMount' .deployguard/build-plan.json)"
          BINDING_COUNT="$(jq '(.serviceBindings // []) | length' .deployguard/build-plan.json)"
          FRONTEND_ID="$(jq -r '.serviceBindings[0].sourceComponent // empty' .deployguard/build-plan.json)"
          FRONTEND_CONTAINER=""
          [ -z "$FRONTEND_ID" ] || FRONTEND_CONTAINER="${COMPONENT_CONTAINERS[$FRONTEND_ID]:-}"
          if [ "$BINDING_COUNT" -gt 0 ] && [ -n "$FRONTEND_CONTAINER" ]; then
            # Validate the generated proxy contract itself; a concrete app
            # endpoint is optional and is verified separately when proven.
            docker exec "$FRONTEND_CONTAINER" nginx -T 2>/dev/null | grep -F "location ${BINDING_MOUNT%/}/" >/dev/null \
              || { echo "EXECUTABLE_PREFLIGHT_FAILED: generated platform service binding is absent from the frontend proxy." >&2; exit 1; }
          fi
          RELATIONSHIP_PATH="$(jq -r '.relationships[0].verificationPath // empty' .deployguard/build-plan.json)"
          if [ -n "$RELATIONSHIP_PATH" ] && [ -n "$FRONTEND_CONTAINER" ]; then
            OWNER_IP="$(docker inspect --format "{{with index .NetworkSettings.Networks \"$NETWORK\"}}{{.IPAddress}}{{end}}" "$NAMESPACE_CONTAINER")"; FRONTEND_PORT="$(printf '%s' "$COMPONENTS" | jq -r --arg id "$FRONTEND_ID" '.[] | select(.id == $id) | .port')"
            curl --fail --silent --show-error --max-time 5 "http://$OWNER_IP:$FRONTEND_PORT$RELATIONSHIP_PATH" >/dev/null || { echo "EXECUTABLE_PREFLIGHT_FAILED: proven frontend/backend relationship endpoint failed." >&2; exit 1; }
          fi
          echo "Executable immutable application contract passed before persistence and Terraform."

      - name: Install Terraform
        if: inputs.deployment_action == 'deploy' || inputs.deployment_action == 'destroy' || inputs.deployment_action == 'rollback' || inputs.deployment_action == 'promote' || inputs.deployment_action == 'cleanup'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Prepare project-scoped persistence
        if: inputs.deployment_action == 'deploy' || inputs.deployment_action == 'destroy' || inputs.deployment_action == 'rollback'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deployguard/project-terraform
          cat > .deployguard/project-terraform/main.tf <<'TERRAFORM'
          terraform {
            backend "s3" {}
            required_providers {
              aws    = { source = "hashicorp/aws", version = "~> 5.0" }
              random = { source = "hashicorp/random", version = "~> 3.0" }
            }
          }
          provider "aws" { region = var.aws_region }
          variable "aws_region" { type = string }
          variable "project_id" { type = string }
          variable "environment_name" { type = string }
          variable "vpc_id" { type = string }
          variable "public_subnet_ids" { type = list(string) }
          variable "runtime_config" { type = any }
          data "aws_vpc" "platform" { id = var.vpc_id }
          locals {
            database = try(var.runtime_config.managedDatabase, null)
            database_profiles = {
              postgres = {
                image                       = "postgres:16", port = 5432, data_path = "/var/lib/postgresql/data",
                health_check                = ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"],
                initialization_environment  = [{ name = "POSTGRES_DB", value_source = "databaseName" }, { name = "POSTGRES_USER", value_source = "databaseUser" }],
                initialization_secret_names = ["POSTGRES_PASSWORD"], url_scheme = "postgresql", url_query = ""
              }
              mysql = {
                image                       = "mysql:8", port = 3306, data_path = "/var/lib/mysql",
                health_check                = ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$MYSQL_USER\" -p\"$MYSQL_PASSWORD\" --silent"],
                initialization_environment  = [{ name = "MYSQL_DATABASE", value_source = "databaseName" }, { name = "MYSQL_USER", value_source = "databaseUser" }],
                initialization_secret_names = ["MYSQL_PASSWORD", "MYSQL_ROOT_PASSWORD"], url_scheme = "mysql", url_query = ""
              }
              mongodb = {
                image                       = "mongo:8", port = 27017, data_path = "/data/db",
                health_check                = ["CMD-SHELL", "mongosh --quiet --username \"$MONGO_INITDB_ROOT_USERNAME\" --password \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' >/dev/null"],
                initialization_environment  = [{ name = "MONGO_INITDB_DATABASE", value_source = "databaseName" }, { name = "MONGO_INITDB_ROOT_USERNAME", value_source = "databaseUser" }],
                initialization_secret_names = ["MONGO_INITDB_ROOT_PASSWORD"], url_scheme = "mongodb", url_query = "?authSource=admin"
              }
            }
            database_profile = local.database == null ? null : try(local.database_profiles[local.database.engine], null)
            enabled          = local.database != null && local.database_profile != null && try(local.database.provider, "") == "managed"
            prefix           = substr(replace(lower(var.project_id), "_", "-"), 0, 8)
            name             = "dg-${local.prefix}-database"
            tags = {
              ManagedBy            = "DeployGuard"
              DeployGuardProjectId = var.project_id
              Environment          = var.environment_name
              DeployGuardScope     = "project"
            }
          }
          resource "aws_cloudwatch_log_group" "database" {
            count             = local.enabled ? 1 : 0
            name              = "/deployguard/${var.project_id}/${var.environment_name}/database"
            retention_in_days = 14
            tags              = merge(local.tags, { LogPurpose = "database" })
          }
          resource "aws_secretsmanager_secret" "password" {
            count                   = local.enabled ? 1 : 0
            name                    = "deployguard/${var.project_id}/${var.environment_name}/database/password"
            recovery_window_in_days = 0
            tags                    = merge(local.tags, { SecretPurpose = "database_password" })
          }
          resource "random_password" "database" {
            count            = local.enabled ? 1 : 0
            length           = 32
            special          = true
            override_special = "_-"
          }
          resource "aws_secretsmanager_secret_version" "password" {
            count         = local.enabled ? 1 : 0
            secret_id     = aws_secretsmanager_secret.password[0].id
            secret_string = random_password.database[0].result
            lifecycle { ignore_changes = [secret_string] }
          }
          resource "aws_service_discovery_private_dns_namespace" "database" {
            count = local.enabled ? 1 : 0
            name  = "project-${var.project_id}.deployguard.local"
            vpc   = var.vpc_id
            tags  = merge(local.tags, { ServicePurpose = "database_namespace" })
          }
          resource "aws_service_discovery_service" "database" {
            count = local.enabled ? 1 : 0
            name  = "db"
            dns_config {
              namespace_id = aws_service_discovery_private_dns_namespace.database[0].id
              dns_records {
                ttl  = 10
                type = "A"
              }
              routing_policy = "MULTIVALUE"
            }
            health_check_custom_config { failure_threshold = 1 }
            tags = merge(local.tags, { ServicePurpose = "database" })
          }
          resource "aws_secretsmanager_secret" "url" {
            count                   = local.enabled ? 1 : 0
            name                    = "deployguard/${var.project_id}/${var.environment_name}/database/url"
            recovery_window_in_days = 0
            tags                    = merge(local.tags, { SecretPurpose = "database_url" })
          }
          resource "aws_secretsmanager_secret_version" "url" {
            count         = local.enabled ? 1 : 0
            secret_id     = aws_secretsmanager_secret.url[0].id
            secret_string = "${local.database_profile.url_scheme}://${local.database.databaseUser}:${urlencode(random_password.database[0].result)}@${local.database.host}:${local.database_profile.port}/${local.database.databaseName}${local.database_profile.url_query}"
            lifecycle { ignore_changes = [secret_string] }
          }
          resource "aws_security_group" "database" {
            count  = local.enabled ? 1 : 0
            name   = "${local.name}-service"
            vpc_id = var.vpc_id
            tags   = local.tags
            ingress {
              from_port   = local.database_profile.port
              to_port     = local.database_profile.port
              protocol    = "tcp"
              cidr_blocks = [data.aws_vpc.platform.cidr_block]
            }
            egress {
              from_port   = 0
              to_port     = 0
              protocol    = "-1"
              cidr_blocks = ["0.0.0.0/0"]
            }
          }
          resource "aws_security_group" "efs" {
            count  = local.enabled ? 1 : 0
            name   = "${local.name}-efs"
            vpc_id = var.vpc_id
            tags   = local.tags
            ingress {
              from_port   = 2049
              to_port     = 2049
              protocol    = "tcp"
              cidr_blocks = [data.aws_vpc.platform.cidr_block]
            }
            egress {
              from_port   = 0
              to_port     = 0
              protocol    = "-1"
              cidr_blocks = ["0.0.0.0/0"]
            }
          }
          resource "aws_efs_file_system" "database" {
            count          = local.enabled ? 1 : 0
            creation_token = "dg-efs-${local.prefix}-${substr(sha256(join(":", [var.project_id, var.environment_name, "project-persistence"])), 0, 40)}"
            encrypted      = true
            lifecycle_policy { transition_to_ia = "AFTER_30_DAYS" }
            tags = merge(local.tags, { Name = "deployguard-${var.project_id}-${var.environment_name}-database", Persistence = "project" })
          }
          resource "aws_efs_mount_target" "database" {
            count           = local.enabled ? length(var.public_subnet_ids) : 0
            file_system_id  = aws_efs_file_system.database[0].id
            subnet_id       = var.public_subnet_ids[count.index]
            security_groups = [aws_security_group.efs[0].id]
          }
          resource "aws_efs_access_point" "database" {
            count          = local.enabled ? 1 : 0
            file_system_id = aws_efs_file_system.database[0].id
            posix_user {
              uid = 999
              gid = 999
            }
            root_directory {
              path = "/database"
              creation_info {
                owner_uid   = 999
                owner_gid   = 999
                permissions = "700"
              }
            }
            tags = merge(local.tags, { Persistence = "project" })
          }
          resource "aws_iam_role" "execution" {
            count              = local.enabled ? 1 : 0
            name               = "${local.name}-execution"
            assume_role_policy = jsonencode({ Version = "2012-10-17", Statement = [{ Effect = "Allow", Principal = { Service = "ecs-tasks.amazonaws.com" }, Action = "sts:AssumeRole" }] })
            tags               = local.tags
          }
          resource "aws_iam_role_policy" "execution" {
            count = local.enabled ? 1 : 0
            name  = "database-runtime"
            role  = aws_iam_role.execution[0].id
            policy = jsonencode({ Version = "2012-10-17", Statement = [
              { Effect = "Allow", Action = ["logs:CreateLogStream", "logs:PutLogEvents"], Resource = ["${aws_cloudwatch_log_group.database[0].arn}:*"] },
              { Effect = "Allow", Action = ["secretsmanager:GetSecretValue"], Resource = [aws_secretsmanager_secret.password[0].arn] }
            ] })
          }
          resource "aws_iam_role" "task" {
            count              = local.enabled ? 1 : 0
            name               = "${local.name}-task"
            assume_role_policy = jsonencode({ Version = "2012-10-17", Statement = [{ Effect = "Allow", Principal = { Service = "ecs-tasks.amazonaws.com" }, Action = "sts:AssumeRole" }] })
            tags               = local.tags
          }
          resource "aws_iam_role_policy" "efs" {
            count  = local.enabled ? 1 : 0
            name   = "database-efs"
            role   = aws_iam_role.task[0].id
            policy = jsonencode({ Version = "2012-10-17", Statement = [{ Effect = "Allow", Action = ["elasticfilesystem:ClientMount", "elasticfilesystem:ClientWrite"], Resource = [aws_efs_file_system.database[0].arn], Condition = { StringEquals = { "elasticfilesystem:AccessPointArn" = aws_efs_access_point.database[0].arn } } }] })
          }
          resource "aws_ecs_task_definition" "database" {
            count                    = local.enabled ? 1 : 0
            family                   = local.name
            network_mode             = "awsvpc"
            requires_compatibilities = ["FARGATE"]
            cpu                      = "512"
            memory                   = "1024"
            execution_role_arn       = aws_iam_role.execution[0].arn
            task_role_arn            = aws_iam_role.task[0].arn
            skip_destroy             = true
            tags                     = local.tags
            container_definitions = jsonencode([{
              name             = "database", image = local.database_profile.image, essential = true,
              portMappings     = [{ containerPort = local.database_profile.port, hostPort = local.database_profile.port, protocol = "tcp" }],
              environment      = [for item in local.database_profile.initialization_environment : { name = item.name, value = item.value_source == "databaseName" ? local.database.databaseName : local.database.databaseUser }],
              secrets          = [for name in local.database_profile.initialization_secret_names : { name = name, valueFrom = aws_secretsmanager_secret.password[0].arn }],
              mountPoints      = [{ sourceVolume = "database-data", containerPath = local.database_profile.data_path, readOnly = false }],
              healthCheck      = { command = local.database_profile.health_check, interval = 10, timeout = 5, retries = 6, startPeriod = 20 },
              logConfiguration = { logDriver = "awslogs", options = { awslogs-group = aws_cloudwatch_log_group.database[0].name, awslogs-region = var.aws_region, awslogs-stream-prefix = "database" } }
            }])
            volume {
              name = "database-data"
              efs_volume_configuration {
                file_system_id     = aws_efs_file_system.database[0].id
                transit_encryption = "ENABLED"
                authorization_config {
                  access_point_id = aws_efs_access_point.database[0].id
                  iam             = "ENABLED"
                }
              }
            }
          }
          resource "aws_ecs_service" "database" {
            count                 = local.enabled ? 1 : 0
            name                  = local.name
            cluster               = var.runtime_config.platformFoundation.ecsClusterArn
            task_definition       = aws_ecs_task_definition.database[0].arn
            desired_count         = 1
            launch_type           = "FARGATE"
            wait_for_steady_state = true
            tags                  = local.tags
            network_configuration {
              subnets          = var.public_subnet_ids
              security_groups  = [aws_security_group.database[0].id]
              assign_public_ip = true
            }
            service_registries { registry_arn = aws_service_discovery_service.database[0].arn }
            depends_on = [aws_secretsmanager_secret_version.password, aws_efs_mount_target.database, aws_iam_role_policy.efs, aws_iam_role_policy.execution]
          }
          output "database_internal_host" { value = local.enabled ? local.database.host : null }
          output "database_service_arn" { value = local.enabled ? aws_ecs_service.database[0].id : null }
          output "database_cloud_map_service_arn" { value = local.enabled ? aws_service_discovery_service.database[0].arn : null }
          output "database_password_secret_arn" { value = local.enabled ? aws_secretsmanager_secret.password[0].arn : null }
          output "database_url_secret_arn" { value = local.enabled ? aws_secretsmanager_secret.url[0].arn : null }
          output "database_efs_file_system_id" { value = local.enabled ? aws_efs_file_system.database[0].id : null }
          output "database_efs_access_point_id" { value = local.enabled ? aws_efs_access_point.database[0].id : null }
          TERRAFORM
          node <<'NODE'
          const fs = require("fs");
          const runtime = JSON.parse(fs.readFileSync(".deployguard/runtime-config.json", "utf8"));
          fs.writeFileSync(".deployguard/project-terraform/terraform.tfvars.json", JSON.stringify({
            aws_region: process.env.AWS_REGION, project_id: process.env.PROJECT_ID,
            environment_name: process.env.ENVIRONMENT_NAME, vpc_id: process.env.VPC_ID,
            public_subnet_ids: process.env.PUBLIC_SUBNET_IDS.split(",").filter(Boolean), runtime_config: runtime,
          }), { mode: 0o600 });
          NODE
          terraform -chdir=.deployguard/project-terraform fmt -check
          terraform -chdir=.deployguard/project-terraform init -input=false \
            -backend-config="bucket=$TERRAFORM_STATE_BUCKET" \
            -backend-config="key=projects/$PROJECT_ID/$ENVIRONMENT_NAME/project/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform -chdir=.deployguard/project-terraform validate
          if [ "$DEPLOYMENT_ACTION" = "deploy" ]; then
            terraform -chdir=.deployguard/project-terraform plan -input=false -out=project.tfplan
            terraform -chdir=.deployguard/project-terraform show -json project.tfplan \
              | jq '
                  def redact($value; $mask):
                    if $mask == true then null
                    elif (($mask | type) == "object" and ($value | type) == "object") then
                      reduce ($value | keys_unsorted[]) as $key ({}; .[$key] = redact($value[$key]; ($mask[$key] // false)))
                    elif (($mask | type) == "array" and ($value | type) == "array") then
                      [range(0; $value | length) as $index | redact($value[$index]; ($mask[$index] // false))]
                    else $value end;
                  .resource_changes = ((.resource_changes // []) | map(
                    .change.before = redact(.change.before; (.change.before_sensitive // false))
                    | .change.after = redact(.change.after; (.change.after_sensitive // false))
                    | del(.change.before_sensitive, .change.after_sensitive)
                  ))
                ' > .deployguard/project-terraform/deployguard-project-cost-plan.json
            terraform -chdir=.deployguard/project-terraform apply -input=false -auto-approve project.tfplan
          fi
          if [ "$DEPLOYMENT_ACTION" != "destroy" ]; then
            terraform -chdir=.deployguard/project-terraform output -json | jq -c 'with_entries(.value = .value.value)' > .deployguard/project-persistence-outputs.json
          fi

      - name: Generate deployment Terraform
        if: inputs.deployment_action == 'deploy' || inputs.deployment_action == 'destroy' || inputs.deployment_action == 'rollback' || inputs.deployment_action == 'cleanup'
        shell: bash
        env:
          IMAGE_URI: ${{ inputs.deployment_action == 'deploy' && steps.image.outputs.uri || inputs.deployment_action == 'rollback' && inputs.rollback_image_uri || 'destroy.invalid' }}
        run: |
          set -euo pipefail
          mkdir -p .deployguard/terraform
          # Destroy consumes only the validated project-deletion context. The
          # exact resources to remove come from its isolated Terraform state;
          # deploy-only routing and shared-foundation values are not required.
          if [ "$DEPLOYMENT_ACTION" = "destroy" ]; then
            cat > .deployguard/terraform/main.tf <<'TERRAFORM'
          terraform {
            backend "s3" {}
            required_providers {
              aws = { source = "hashicorp/aws", version = "~> 5.0" }
            }
          }
          variable "aws_region" { type = string }
          provider "aws" { region = var.aws_region }
          TERRAFORM
            node <<'NODE'
            const fs = require("fs");
            fs.writeFileSync(
              ".deployguard/terraform/terraform.tfvars.json",
              JSON.stringify({ aws_region: process.env.AWS_REGION }),
              { mode: 0o600 },
            );
          NODE
            exit 0
          fi
          cat > .deployguard/terraform/main.tf <<'TERRAFORM'
          terraform {
            backend "s3" {}
            required_providers {
              aws    = { source = "hashicorp/aws", version = "~> 5.0" }
              random = { source = "hashicorp/random", version = "~> 3.0" }
            }
          }
          provider "aws" { region = var.aws_region }
          variable "aws_region" { type = string }
          variable "project_id" { type = string }
          variable "environment_name" { type = string }
          variable "generation_id" { type = string }
          variable "infrastructure_namespace" { type = string }
          variable "vpc_id" { type = string }
          variable "public_subnet_ids" { type = list(string) }
          variable "app_port" { type = number }
          variable "health_check_path" { type = string }
          variable "image_uri" { type = string }
          variable "component_images" { type = map(string) }
          variable "build_plan" { type = any }
          variable "runtime_config" {
            type = any
          }
          variable "project_persistence_outputs" {
            type    = any
            default = {}
          }
          locals {
            project_prefix    = substr(replace(lower(var.project_id), "_", "-"), 0, 8)
            generation_prefix = substr(replace(lower(var.generation_id), "_", "-"), 0, 8)
            name              = "dg-${local.project_prefix}-${local.generation_prefix}"
          }
          locals {
            log_group_prefix = var.infrastructure_namespace
            ownership_tags = {
              ManagedBy               = "DeployGuard"
              DeployGuardProjectId    = var.project_id
              Environment             = var.environment_name
              DeployGuardGenerationId = var.generation_id
            }
            runtime_config              = var.runtime_config
            components                  = try(var.build_plan.components, [{ id = "application", role = "application", port = var.app_port, healthPath = var.health_check_path, language = var.build_plan.language }])
            primary_component           = try([for component in local.components : component if component.role == "frontend"][0], local.components[0])
            backend_component           = try([for component in local.components : component if component.role == "backend"][0], null)
            full_stack                  = local.backend_component != null && local.primary_component.role == "frontend"
            managed_database            = try(local.runtime_config.managedDatabase, null)
            managed_database_configured = local.managed_database != null && try(local.managed_database.provider, "") == "managed"
            component_runtime          = try(local.runtime_config.componentRuntime, {})
            application_secret_arns     = distinct(flatten([for runtime in values(local.component_runtime) : [for reference in values(try(runtime.secretReferences, {})) : join(":", slice(split(":", reference), 0, 7))]]))
          }
          resource "aws_cloudwatch_log_group" "app" {
            name              = "${local.log_group_prefix}/app"
            retention_in_days = 14
            tags              = merge(local.ownership_tags, { LogPurpose = "app" })
          }
          resource "aws_cloudwatch_log_group" "deployment" {
            name              = "${local.log_group_prefix}/deployment"
            retention_in_days = 14
            tags              = merge(local.ownership_tags, { LogPurpose = "deployment" })
          }
          resource "aws_security_group" "service" {
            name   = "${local.name}-svc"
            vpc_id = var.vpc_id
            tags   = local.ownership_tags
            ingress {
              from_port       = tonumber(local.primary_component.port)
              to_port         = tonumber(local.primary_component.port)
              protocol        = "tcp"
              security_groups = [local.runtime_config.platformFoundation.albSecurityGroupId]
            }
            egress {
              from_port   = 0
              to_port     = 0
              protocol    = "-1"
              cidr_blocks = ["0.0.0.0/0"]
            }
          }
          resource "aws_lb_target_group" "app" {
            name_prefix = substr(local.name, 0, 6)
            port        = tonumber(local.primary_component.port)
            protocol    = "HTTP"
            vpc_id      = var.vpc_id
            target_type = "ip"
            tags        = merge(local.ownership_tags, { DeployGuardResource = "app-target-group" })
            lifecycle { create_before_destroy = true }
            health_check {
              # A proven application endpoint gets normal health semantics.
              # Otherwise '/' is platform HTTP liveness, not an invented app
              # health route; ordinary client responses show the server lives.
              path                = try(local.primary_component.healthCheckMode, "http") == "http" ? local.primary_component.healthPath : "/"
              matcher             = try(local.primary_component.healthCheckMode, "http") == "http" ? "200-399" : "200-499"
              interval            = 30
              timeout             = 10
              healthy_threshold   = 2
              unhealthy_threshold = 3
            }
          }
          resource "aws_lb_listener_rule" "candidate" {
            listener_arn = local.runtime_config.platformFoundation.listenerArn
            priority     = local.runtime_config.routing.verificationPriority
            action {
              type             = "forward"
              target_group_arn = aws_lb_target_group.app.arn
            }
            condition {
              host_header { values = [local.runtime_config.routing.candidateHost] }
            }
            tags = merge(local.ownership_tags, { DeployGuardResource = "candidate-route" })
          }
          resource "aws_iam_role" "execution" {
            name               = "${local.name}-execution"
            assume_role_policy = jsonencode({ Version = "2012-10-17", Statement = [{ Effect = "Allow", Principal = { Service = "ecs-tasks.amazonaws.com" }, Action = "sts:AssumeRole" }] })
            tags               = local.ownership_tags
          }
          resource "aws_iam_role_policy" "execution" {
            name = "ecr-pull"
            role = aws_iam_role.execution.id
            policy = jsonencode({ Version = "2012-10-17", Statement = [
              { Effect = "Allow", Action = ["ecr:GetAuthorizationToken", "ecr:BatchCheckLayerAvailability", "ecr:GetDownloadUrlForLayer", "ecr:BatchGetImage"], Resource = "*" },
              { Effect = "Allow", Action = ["logs:CreateLogStream", "logs:PutLogEvents", "logs:DescribeLogStreams"], Resource = [
                "${aws_cloudwatch_log_group.app.arn}:*",
                "${aws_cloudwatch_log_group.deployment.arn}:*"
              ] }
            ] })
          }
          resource "aws_iam_role_policy" "runtime_secrets" {
            count = local.managed_database_configured || length(local.application_secret_arns) > 0 ? 1 : 0
            name  = "runtime-secrets"
            role  = aws_iam_role.execution.id
            policy = jsonencode({ Version = "2012-10-17", Statement = [{
              Effect = "Allow"
              Action = ["secretsmanager:GetSecretValue"]
              Resource = concat(
                local.application_secret_arns,
                local.managed_database_configured ? [var.project_persistence_outputs.database_password_secret_arn, var.project_persistence_outputs.database_url_secret_arn] : []
              )
            }] })
          }
          resource "aws_ecs_task_definition" "app" {
            family                   = local.name
            network_mode             = "awsvpc"
            requires_compatibilities = ["FARGATE"]
            cpu                      = "1024"
            memory                   = "2048"
            execution_role_arn       = aws_iam_role.execution.arn
            skip_destroy             = true
            tags                     = local.ownership_tags
            container_definitions = jsonencode([for component in local.components : {
              name         = component.id
              image        = var.component_images[component.id]
              essential    = true
              environment  = [for key in sort(keys(try(local.component_runtime[component.id].environment, {}))) : { name = key, value = tostring(local.component_runtime[component.id].environment[key]) }]
              secrets      = concat(
                [for key in sort(keys(try(local.component_runtime[component.id].secretReferences, {}))) : { name = key, valueFrom = local.component_runtime[component.id].secretReferences[key] }],
                component.id == try(local.managed_database.ownerComponentId, "") ? [for key in sort(keys(try(local.managed_database.secretAliases, {}))) : {
                  name      = key
                  valueFrom = local.managed_database.secretAliases[key] == "url" ? var.project_persistence_outputs.database_url_secret_arn : var.project_persistence_outputs.database_password_secret_arn
                } if local.managed_database_configured] : []
              )
              portMappings = [{ containerPort = tonumber(component.port), hostPort = tonumber(component.port), protocol = "tcp" }]
              dependsOn    = local.full_stack && component.role == "frontend" ? [{ containerName = local.backend_component.id, condition = "HEALTHY" }] : []
              healthCheck = {
                command     = try(component.healthCheckMode, "http") == "tcp" ? (component.language == "python" ? ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',${component.port}),5); s.close()\""] : ["CMD-SHELL", "node -e \"const s=require('net').connect(${component.port},'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))\""]) : component.language == "python" ? ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${component.port}${component.healthPath}', timeout=5)\""] : component.runtimeType == "static" ? ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${component.port}${component.healthPath} || exit 1"] : ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:${component.port}${component.healthPath}',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))\""]
                interval    = 30
                timeout     = 5
                retries     = 3
                startPeriod = 30
              }
              logConfiguration = { logDriver = "awslogs", options = {
                awslogs-group         = aws_cloudwatch_log_group.app.name
                awslogs-region        = var.aws_region
                awslogs-stream-prefix = component.id
              } }
            }])
          }
          resource "aws_ecs_service" "app" {
            name                  = local.name
            cluster               = local.runtime_config.platformFoundation.ecsClusterArn
            task_definition       = aws_ecs_task_definition.app.arn
            desired_count         = 1
            launch_type           = "FARGATE"
            wait_for_steady_state = true
            tags                  = local.ownership_tags
            network_configuration {
              subnets          = var.public_subnet_ids
              security_groups  = [aws_security_group.service.id]
              assign_public_ip = true
            }
            load_balancer {
              target_group_arn = aws_lb_target_group.app.arn
              container_name   = local.primary_component.id
              container_port   = tonumber(local.primary_component.port)
            }
            depends_on = [aws_lb_listener_rule.candidate, aws_iam_role_policy.execution, aws_iam_role_policy.runtime_secrets]
          }
          output "deployed_url" { value = "http://${local.runtime_config.routing.candidateHost}" }
          output "production_url" { value = "http://${local.runtime_config.routing.productionHost}" }
          output "cluster_name" { value = local.runtime_config.platformFoundation.ecsClusterName }
          output "service_name" { value = aws_ecs_service.app.name }
          output "ecs_service_arn" { value = aws_ecs_service.app.id }
          output "target_group_arn" { value = aws_lb_target_group.app.arn }
          output "candidate_listener_rule_arn" { value = aws_lb_listener_rule.candidate.arn }
          output "task_definition_arn" { value = aws_ecs_task_definition.app.arn }
          output "component_images" { value = var.component_images }
          output "component_contract" { value = local.components }
          output "database_internal_host" { value = local.managed_database_configured ? var.project_persistence_outputs.database_internal_host : null }
          output "database_service_arn" { value = local.managed_database_configured ? var.project_persistence_outputs.database_service_arn : null }
          output "database_cloud_map_service_arn" { value = local.managed_database_configured ? var.project_persistence_outputs.database_cloud_map_service_arn : null }
          output "database_password_secret_arn" { value = local.managed_database_configured ? var.project_persistence_outputs.database_password_secret_arn : null }
          output "database_url_secret_arn" { value = local.managed_database_configured ? var.project_persistence_outputs.database_url_secret_arn : null }
          output "database_efs_file_system_id" { value = local.managed_database_configured ? var.project_persistence_outputs.database_efs_file_system_id : null }
          output "database_efs_access_point_id" { value = local.managed_database_configured ? var.project_persistence_outputs.database_efs_access_point_id : null }

          TERRAFORM
          if [ "$DEPLOYMENT_ACTION" = "rollback" ]; then
            aws ecs describe-task-definition --task-definition "$ROLLBACK_TASK_DEFINITION_ARN" --output json > .deployguard/rollback-task-definition.json
          fi
          IMAGE_URI="$IMAGE_URI" node <<'NODE'
          const fs = require("fs");
          const runtime = JSON.parse(fs.readFileSync(".deployguard/runtime-config.json", "utf8"));
          const buildPlan = JSON.parse(fs.readFileSync(".deployguard/build-plan.json", "utf8"));
          const components = Array.isArray(buildPlan.components) && buildPlan.components.length
            ? buildPlan.components
            : [{ id: "app", role: "application", port: buildPlan.port, healthPath: buildPlan.healthPath, language: buildPlan.language }];
          let componentImages;
          if (process.env.DEPLOYMENT_ACTION === "rollback") {
            const task = JSON.parse(fs.readFileSync(".deployguard/rollback-task-definition.json", "utf8"));
            const byName = new Map((task.taskDefinition?.containerDefinitions || []).map((container) => [container.name, container.image]));
            componentImages = Object.fromEntries(components.map((component) => {
              const image = byName.get(component.id);
              if (!image) throw new Error(`Rollback task definition omits component ${component.id}.`);
              return [component.id, image];
            }));
          } else if (process.env.DEPLOYMENT_ACTION === "deploy") {
            const evidence = JSON.parse(fs.readFileSync(".deployguard/component-images.json", "utf8"));
            componentImages = Object.fromEntries(evidence.map((component) => [component.id, component.imageUri]));
          } else if (runtime.promotion?.candidate) {
            const evidence = Array.isArray(runtime.promotion.candidate.components) && runtime.promotion.candidate.components.length
              ? runtime.promotion.candidate.components
              : [{ id: "app", imageUri: runtime.promotion.candidate.imageUri }];
            componentImages = Object.fromEntries(evidence.map((component) => [component.id, component.imageUri]));
          } else {
            componentImages = Object.fromEntries(components.map((component) => [component.id, "destroy.invalid"]));
          }
          const persistence = fs.existsSync(".deployguard/project-persistence-outputs.json")
            ? JSON.parse(fs.readFileSync(".deployguard/project-persistence-outputs.json", "utf8"))
            : {};
          fs.writeFileSync(".deployguard/terraform/terraform.tfvars.json", JSON.stringify({
            aws_region: process.env.AWS_REGION,
            project_id: process.env.PROJECT_ID,
            environment_name: process.env.ENVIRONMENT_NAME,
            generation_id: process.env.GENERATION_ID,
            infrastructure_namespace: process.env.INFRASTRUCTURE_NAMESPACE,
            vpc_id: process.env.VPC_ID,
            public_subnet_ids: process.env.PUBLIC_SUBNET_IDS.split(",").filter(Boolean),
            app_port: Number(process.env.APP_PORT),
            health_check_path: process.env.HEALTH_CHECK_PATH,
            image_uri: process.env.IMAGE_URI,
            component_images: componentImages,
            build_plan: buildPlan,
            runtime_config: runtime,
            project_persistence_outputs: persistence,
          }), { mode: 0o600 });
          NODE

      - name: Terraform plan and apply
        if: inputs.deployment_action == 'deploy' || inputs.deployment_action == 'destroy' || inputs.deployment_action == 'rollback'
        working-directory: .deployguard/terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive -diff
          terraform init -input=false \
            -backend-config="bucket=$TERRAFORM_STATE_BUCKET" \
            -backend-config="key=projects/$PROJECT_ID/$ENVIRONMENT_NAME/$GENERATION_ID/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          # A generation is authoritative only through its isolated state key.
          # Fresh candidates use only authoritative identities created in this
          # state; retries use the same immutable generation state.
          MANAGED_DATABASE_ENABLED="$(jq -r '.managedDatabase != null' ../runtime-config.json)"
          DEPLOYMENT_MODE="$(jq -r '.deploymentContext.deploymentMode // "FRESH"' ../runtime-config.json)"
          PERSISTENT_STATE="$(jq -r '.deploymentContext.persistentState // "NONE"' ../runtime-config.json)"
          RECOVERY_EVIDENCE_AVAILABLE="$(jq -r '.deploymentContext.recoveryEvidenceAvailable // false' ../runtime-config.json)"
          if [ "$DEPLOYMENT_ACTION" = "destroy" ]; then
            terraform show -json > pre-destroy-state.json
            jq -c '
              def resources: [.values.root_module.resources[]?];
              {
                ecsClusters: [resources[] | select(.type == "aws_ecs_cluster") | .values.name | select(type == "string" and length > 0)],
                ecsServices: [resources[] | select(.type == "aws_ecs_service") | {cluster: .values.cluster, name: .values.name} | select(.cluster != null and .name != null)],
                loadBalancerArns: [resources[] | select(.type == "aws_lb") | .values.arn | select(type == "string" and length > 0)],
                listenerArns: [resources[] | select(.type == "aws_lb_listener") | .values.arn | select(type == "string" and length > 0)],
                targetGroupArns: [resources[] | select(.type == "aws_lb_target_group") | .values.arn | select(type == "string" and length > 0)],
                endpoint: (.values.outputs.deployed_url.value // "")
              }
            ' pre-destroy-state.json > destroy-verification-scope.json

            # A verified destroy removes the complete generation, including
            # database secrets, EFS, access points and application resources.
            # The stable route is not Terraform-owned, so remove only its
            # exact, persisted project-deletion identity before deleting its
            # target group. An already absent rule is an idempotent success.
            STABLE_RULE_ARN="$(jq -r '.projectDeletion.projectResources.stableListenerRuleArn // empty' ../runtime-config.json)"
            if [ -n "$STABLE_RULE_ARN" ]; then
              RULE_ERROR="$(mktemp)"
              if RULE_TAGS="$(aws elbv2 describe-tags --resource-arns "$STABLE_RULE_ARN" --output json 2>"$RULE_ERROR")"; then
                printf '%s' "$RULE_TAGS" | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" '
                  (.TagDescriptions[0].Tags // [] | map({key:.Key,value:.Value}) | from_entries) as $tags
                  | $tags.ManagedBy == "DeployGuard"
                    and $tags.DeployGuardProjectId == $project
                    and $tags.Environment == $environment
                    and $tags.DeployGuardScope == "project"
                ' >/dev/null || { echo "Stable route ownership mismatch." >&2; exit 1; }
                aws elbv2 delete-rule --rule-arn "$STABLE_RULE_ARN" >/dev/null
            elif ! grep -Eq 'ListenerRuleNotFound|RuleNotFound' "$RULE_ERROR"; then
                sed -n '1,20p' "$RULE_ERROR" >&2
                exit 1
              fi
              rm -f "$RULE_ERROR"
            fi
          fi
          terraform validate -no-color
          printf 'DEPLOYGUARD_STAGE=terraform_plan_and_apply\n'
          set +e
          if [ "$DEPLOYMENT_ACTION" = "destroy" ]; then
            terraform plan -destroy -detailed-exitcode -input=false -no-color -out=deployguard.tfplan
          else
            terraform plan -detailed-exitcode -input=false -no-color -out=deployguard.tfplan
          fi
          PLAN_EXIT_CODE="$?"
          set -e
          [ "$PLAN_EXIT_CODE" -eq 0 ] || [ "$PLAN_EXIT_CODE" -eq 2 ] || { echo "Terraform planning failed before apply." >&2; exit "$PLAN_EXIT_CODE"; }
          terraform show -json deployguard.tfplan > deployguard-plan.json
          jq '
            def redact($value; $mask):
              if $mask == true then null
              elif (($mask | type) == "object" and ($value | type) == "object") then
                reduce ($value | keys_unsorted[]) as $key ({}; .[$key] = redact($value[$key]; ($mask[$key] // false)))
              elif (($mask | type) == "array" and ($value | type) == "array") then
                [range(0; $value | length) as $index | redact($value[$index]; ($mask[$index] // false))]
              else $value end;
            .resource_changes = ((.resource_changes // []) | map(
              .change.before = redact(.change.before; (.change.before_sensitive // false))
              | .change.after = redact(.change.after; (.change.after_sensitive // false))
              | del(.change.before_sensitive, .change.after_sensitive)
            ))
          ' deployguard-plan.json > deployguard-cost-plan.json
          jq -c '
            reduce (.resource_changes[]? | {type: .type, actions: (.change.actions // [])}) as $change
              ({create:0,update:0,replace:0,delete:0,noOp:0,resourceTypes:[]};
                .resourceTypes += [$change.type]
                | if (($change.actions | index("create")) and ($change.actions | index("delete"))) then .replace += 1
                  elif ($change.actions | index("create")) then .create += 1
                  elif ($change.actions | index("update")) then .update += 1
                  elif ($change.actions | index("delete")) then .delete += 1
                  else .noOp += 1 end)
            | .resourceTypes |= (map(select(type == "string")) | unique | sort)
          ' deployguard-plan.json > deployguard-plan-summary.json
          PERSISTENT_CHANGE_COUNT="$(jq '[.resource_changes[]? | select((.type | test("^aws_secretsmanager_secret(_version)?$|^aws_efs_(file_system|access_point)$")) and any(.change.actions[]?; . != "no-op" and . != "read"))] | length' deployguard-plan.json)"
          if [ "$DEPLOYMENT_ACTION" = "deploy" ] && [ "$PERSISTENT_STATE" = "PERSISTENT" ] && { [ "$DEPLOYMENT_MODE" = "UPDATE" ] || [ "$DEPLOYMENT_MODE" = "RETRY" ]; } && [ "$PERSISTENT_CHANGE_COUNT" -gt 0 ]; then
            echo "An application release cannot modify the active generation's verified database filesystem or secrets. Use the explicit recovery/reset flow for persistence changes." >&2
            exit 1
          fi
          DESTRUCTIVE_PERSISTENT_COUNT="$(jq '[.resource_changes[]? | select((.type | test("^aws_secretsmanager_secret(_version)?$|^aws_efs_(file_system|access_point)$")) and ((.change.actions // []) | index("delete")))] | length' deployguard-plan.json)"
          if [ "$DEPLOYMENT_ACTION" = "deploy" ] && [ "$DESTRUCTIVE_PERSISTENT_COUNT" -gt 0 ]; then
            if [ "$PERSISTENT_STATE" = "PERSISTENT" ] && [ "$RECOVERY_EVIDENCE_AVAILABLE" != "true" ]; then
              echo "This deployment would replace or remove persistent application data. No verified recovery source is available. Restore a backup or explicitly start a fresh deployment." >&2
              exit 1
            fi
            if [ "$PERSISTENT_STATE" = "NONE" ]; then
              echo "The plan only replaces incomplete resources from a generation in which persistent data was never established. Recovery protection is not required."
            else
              echo "The plan changes persistent resources and verified recovery evidence is available."
            fi
          fi
          if ! jq -e --arg action "$DEPLOYMENT_ACTION" --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" --arg generation "$GENERATION_ID" --arg persistent_state "$PERSISTENT_STATE" --arg recovery_available "$RECOVERY_EVIDENCE_AVAILABLE" --arg namespace "$INFRASTRUCTURE_NAMESPACE" '
            def actions: (.change.actions // []);
            def deletes: (actions | index("delete")) != null;
            def retained: (.type | test("^aws_secretsmanager_secret(_version)?$|^aws_efs_(file_system|access_point)$"));
            def owned_tags: (.change.after.tags // .change.before.tags // {});
            def wrong_owner:
              owned_tags.ManagedBy == "DeployGuard"
              and (owned_tags.DeployGuardProjectId != $project or owned_tags.Environment != $environment or owned_tags.DeployGuardGenerationId != $generation);
            def cross_namespace:
              ((.change.after.name // .change.before.name // "") as $name
                | (($name | startswith("/deployguard/")) and ($name | startswith($namespace + "/") | not))
                  or (($name | startswith("deployguard/")) and ($name | startswith("deployguard/" + $project + "/" + $environment + "/") | not)));
            [ .resource_changes[]?
              | select(
                  (retained and deletes and $action != "destroy" and ($persistent_state == "PERSISTENT" and $recovery_available != "true"))
                  or ($action == "destroy" and (deletes | not))
                  or ($action != "destroy" and .type == "aws_cloudwatch_log_group" and deletes)
                  or wrong_owner
                  or cross_namespace
                )
              | {address, type, actions: (.change.actions // [])}
            ] | length == 0
          ' deployguard-plan.json >/dev/null; then
            echo "Terraform plan safety policy rejected an unexpected retained-resource or ownership change." >&2
            exit 1
          fi
          PLAN_SUMMARY="$(jq -c '. + {safety:"passed"}' deployguard-plan-summary.json)"
          printf 'DEPLOYGUARD_PLAN_SUMMARY=%s\n' "$PLAN_SUMMARY"
          printf 'DEPLOYGUARD_STAGE=terraform_apply\n'
          terraform apply -input=false -auto-approve deployguard.tfplan

      - name: Destroy other recorded generations exactly
        if: inputs.deployment_action == 'destroy'
        shell: bash
        run: |
          set -euo pipefail
          [ -f .deployguard/operation-contract.valid ] || { echo "Immutable project deletion contract was not validated." >&2; exit 1; }
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            GENERATION="$(printf '%s' "$encoded" | base64 --decode)"
            RECORDED_ID="$(printf '%s' "$GENERATION" | jq -r '.generationId')"
            [ "$RECORDED_ID" != "$GENERATION_ID" ] || continue
            STATE_KEY="$(printf '%s' "$GENERATION" | jq -r '.terraformStateKey')"
            EXPECTED_KEY="projects/$PROJECT_ID/$ENVIRONMENT_NAME/$RECORDED_ID/terraform.tfstate"
            [ "$STATE_KEY" = "$EXPECTED_KEY" ] || { echo "Recorded generation state identity mismatch." >&2; exit 1; }
            WORK=".deployguard/delete-generation-$RECORDED_ID"
            mkdir -p "$WORK"
            cp .deployguard/terraform/main.tf "$WORK/main.tf"
            jq -n --arg aws_region "$AWS_REGION" '{aws_region:$aws_region}' > "$WORK/terraform.tfvars.json"
            terraform -chdir="$WORK" fmt -check -recursive
            terraform -chdir="$WORK" init -input=false -backend-config="bucket=$TERRAFORM_STATE_BUCKET" -backend-config="key=$STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
            terraform -chdir="$WORK" validate -no-color
            terraform -chdir="$WORK" plan -destroy -input=false -no-color -out=destroy.tfplan
            terraform -chdir="$WORK" show -json destroy.tfplan > "$WORK/destroy-plan.json"
            jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" --arg generation "$RECORDED_ID" '
              [ .resource_changes[]? | select(
                any(.change.actions[]?; . == "create" or . == "update")
                or ((.change.before.tags // {}) as $tags | ($tags | length) > 0 and (
                  $tags.ManagedBy != "DeployGuard"
                  or $tags.DeployGuardProjectId != $project
                  or $tags.Environment != $environment
                  or $tags.DeployGuardGenerationId != $generation)))
              ] | length == 0
            ' "$WORK/destroy-plan.json" >/dev/null || { echo "Recorded generation Destroy plan crossed its ownership boundary." >&2; exit 1; }
            terraform -chdir="$WORK" apply -input=false -auto-approve destroy.tfplan
          done < <(jq -r '.projectDeletion.generations[] | @base64' .deployguard/runtime-config.json)

      - name: Destroy project-scoped persistence
        if: inputs.deployment_action == 'destroy'
        working-directory: .deployguard/project-terraform
        shell: bash
        run: |
          set -euo pipefail
          [ -f ../operation-contract.valid ] || { echo "Immutable Destroy contract was not validated; refusing project-persistence mutation." >&2; exit 1; }
          terraform fmt -check -recursive -diff
          terraform init -input=false \
            -backend-config="bucket=$TERRAFORM_STATE_BUCKET" \
            -backend-config="key=projects/$PROJECT_ID/$ENVIRONMENT_NAME/project/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform validate -no-color
          terraform plan -destroy -input=false -no-color -out=project-destroy.tfplan
          terraform show -json project-destroy.tfplan > project-destroy-plan.json
          jq -e '[.resource_changes[]? | select(any(.change.actions[]?; . == "create" or . == "update"))] | length == 0' project-destroy-plan.json >/dev/null \
            || { echo "Project persistence Destroy plan contains a non-delete mutation." >&2; exit 1; }
          terraform apply -input=false -auto-approve project-destroy.tfplan

      - name: Delete exact project-owned runtime artifacts
        if: inputs.deployment_action == 'destroy'
        shell: bash
        run: |
          set -euo pipefail
          [ -f .deployguard/operation-contract.valid ] || { echo "Immutable project deletion contract was not validated." >&2; exit 1; }
          PROJECT_PREFIX="$(printf '%s' "$PROJECT_ID" | tr '[:upper:]_' '[:lower:]-' | cut -c1-8)"

          RUNTIME_SECRET="$(jq -r '.projectDeletion.projectResources.runtimeSecretName' .deployguard/runtime-config.json)"
          SECRET_ERROR="$(mktemp)"
          if SECRET="$(aws secretsmanager describe-secret --secret-id "$RUNTIME_SECRET" --output json 2>"$SECRET_ERROR")"; then
            printf '%s' "$SECRET" | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" '
              ((.Tags // [] | map({key:.Key,value:.Value}) | from_entries) as $tags
                | $tags.ManagedBy == "DeployGuard"
                  and $tags.DeployGuardProjectId == $project
                  and $tags.Environment == $environment
                  and $tags.DeployGuardScope == "project")
            ' >/dev/null || { echo "Runtime secret ownership mismatch." >&2; exit 1; }
            aws secretsmanager delete-secret --secret-id "$RUNTIME_SECRET" --force-delete-without-recovery >/dev/null
          elif ! grep -q 'ResourceNotFoundException' "$SECRET_ERROR"; then
            sed -n '1,20p' "$SECRET_ERROR" >&2
            exit 1
          fi
          rm -f "$SECRET_ERROR"

          REPOSITORY_NAME="$(jq -r '.projectDeletion.projectResources.ecrRepositoryName' .deployguard/runtime-config.json)"
          ECR_ERROR="$(mktemp)"
          if REPOSITORY="$(aws ecr describe-repositories --repository-names "$REPOSITORY_NAME" --output json 2>"$ECR_ERROR")"; then
            REPOSITORY_ARN="$(printf '%s' "$REPOSITORY" | jq -r '.repositories | if length == 1 then .[0].repositoryArn else empty end')"
            [ -n "$REPOSITORY_ARN" ] || { echo "Project ECR identity is ambiguous." >&2; exit 1; }
            aws ecr list-tags-for-resource --resource-arn "$REPOSITORY_ARN" --output json | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" '
              (.tags // [] | map({key:.Key,value:.Value}) | from_entries) as $tags
              | $tags.ManagedBy == "DeployGuard"
                and $tags.DeployGuardProjectId == $project
                and $tags.Environment == $environment
                and $tags.DeployGuardScope == "project"
            ' >/dev/null || { echo "Project ECR ownership mismatch." >&2; exit 1; }
            aws ecr delete-repository --repository-name "$REPOSITORY_NAME" --force >/dev/null
          elif ! grep -q 'RepositoryNotFoundException' "$ECR_ERROR"; then
            sed -n '1,20p' "$ECR_ERROR" >&2
            exit 1
          fi
          rm -f "$ECR_ERROR"

          while IFS= read -r generation; do
            [ -n "$generation" ] || continue
            GENERATION_PREFIX="$(printf '%s' "$generation" | tr '[:upper:]_' '[:lower:]-' | cut -c1-8)"
            FAMILY="dg-$PROJECT_PREFIX-$GENERATION_PREFIX"
            for status in ACTIVE INACTIVE; do
              while IFS= read -r task_definition; do
                [ -n "$task_definition" ] || continue
                TAGS="$(aws ecs list-tags-for-resource --resource-arn "$task_definition" --output json)"
                if ! printf '%s' "$TAGS" | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" --arg generation "$generation" '
                  (.tags // [] | map({key:.key,value:.value}) | from_entries) as $tags
                  | $tags.ManagedBy == "DeployGuard"
                    and $tags.DeployGuardProjectId == $project
                    and $tags.Environment == $environment
                    and $tags.DeployGuardGenerationId == $generation
                ' >/dev/null; then
                  continue
                fi
                if [ "$status" = "ACTIVE" ]; then
                  aws ecs deregister-task-definition --task-definition "$task_definition" >/dev/null
                fi
                aws ecs delete-task-definitions --task-definitions "$task_definition" >/dev/null
              done < <(aws ecs list-task-definitions --family-prefix "$FAMILY" --status "$status" --output json | jq -r '.taskDefinitionArns[]?')
            done
          done < <(jq -r '.projectDeletion.generations[].generationId' .deployguard/runtime-config.json)

      - name: Verify exact candidate health and write evidence
        if: inputs.deployment_action == 'deploy' || inputs.deployment_action == 'rollback'
        working-directory: .deployguard/terraform
        shell: bash
        env:
          IMAGE_URI: ${{ inputs.deployment_action == 'deploy' && steps.image.outputs.uri || inputs.rollback_image_uri }}
          IMAGE_DIGEST: ${{ inputs.deployment_action == 'deploy' && steps.image.outputs.digest || '' }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_DIGEST" ]; then IMAGE_DIGEST="${IMAGE_URI##*@}"; fi
          URL="$(terraform output -raw deployed_url)"
          TARGET_GROUP_ARN="$(terraform output -raw target_group_arn)"
          CLUSTER_NAME="$(terraform output -raw cluster_name)"
          SERVICE_NAME="$(terraform output -raw service_name)"
          TASK_DEFINITION_ARN="$(terraform output -raw task_definition_arn)"
          ECS_SERVICE_ARN="$(terraform output -raw ecs_service_arn)"
          COMPONENT_IMAGES="$(terraform output -json component_images)"
          COMPONENT_CONTRACT="$(terraform output -json component_contract)"
          FULL_STACK="$(printf '%s' "$COMPONENT_CONTRACT" | jq -r '([.[] | select(.role == "frontend")] | length) == 1 and ([.[] | select(.role == "backend")] | length) == 1')"
          TARGET_TAGS="$(aws elbv2 describe-tags --resource-arns "$TARGET_GROUP_ARN" --output json)"
          printf '%s' "$TARGET_TAGS" | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" --arg generation "$GENERATION_ID" '
            (.TagDescriptions[0].Tags | map({key:.Key,value:.Value}) | from_entries) as $tags
            | $tags.ManagedBy == "DeployGuard" and $tags.DeployGuardProjectId == $project
              and $tags.Environment == $environment and $tags.DeployGuardGenerationId == $generation
              and $tags.DeployGuardResource == "app-target-group"
          ' >/dev/null || { echo "Candidate target group ownership does not match the immutable generation." >&2; exit 1; }
          RELATIONSHIP_PATH="$(jq -r '.relationships[0].verificationPath // empty' ../build-plan.json)"
          RELATIONSHIP_VERIFICATION_STATUS="not_required"
          http_liveness() {
            local status
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$1" || true)"
            [[ "$status" =~ ^[234][0-9][0-9]$ ]]
          }
          for attempt in $(seq 1 30); do
            SERVICE="$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" --output json)"
            TASK_DEFINITION="$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION_ARN" --output json)"
            COMPONENTS_READY="$(jq -n --argjson expected "$COMPONENT_IMAGES" --argjson actual "$(printf '%s' "$TASK_DEFINITION" | jq '.taskDefinition.containerDefinitions | map({key:.name,value:.image}) | from_entries')" '$expected == $actual')"
            TARGET_HEALTH="$(aws elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" --output json)"
            ECS_READY="$(printf '%s' "$SERVICE" | jq -r --arg task "$TASK_DEFINITION_ARN" '(.services | length) == 1 and .services[0].taskDefinition == $task and .services[0].desiredCount > 0 and .services[0].runningCount == .services[0].desiredCount and (.services[0].pendingCount // 0) == 0 and any(.services[0].deployments[]?; .status == "PRIMARY" and .rolloutState == "COMPLETED" and .taskDefinition == $task)')"
            TG_READY="$(printf '%s' "$TARGET_HEALTH" | jq -r '(.TargetHealthDescriptions | length) > 0 and all(.TargetHealthDescriptions[]; .TargetHealth.State == "healthy")')"
            HTTP_READY=false
            if http_liveness "$URL$HEALTH_CHECK_PATH"; then HTTP_READY=true; fi
            RELATIONSHIP_READY=true
            BACKEND_COMPONENT_READY=true
            if [ "$FULL_STACK" = "true" ]; then
              BACKEND_ID="$(printf '%s' "$COMPONENT_CONTRACT" | jq -r '.[] | select(.role == "backend") | .id')"
              TASK_ARNS="$(aws ecs list-tasks --cluster "$CLUSTER_NAME" --service-name "$SERVICE_NAME" --desired-status RUNNING --output json | jq -c '.taskArns')"
              BACKEND_COMPONENT_READY=false
              if [ "$(printf '%s' "$TASK_ARNS" | jq 'length')" -gt 0 ]; then
                TASKS="$(aws ecs describe-tasks --cluster "$CLUSTER_NAME" --tasks $(printf '%s' "$TASK_ARNS" | jq -r '.[]') --output json)"
                BACKEND_COMPONENT_READY="$(printf '%s' "$TASKS" | jq -r --arg backend "$BACKEND_ID" '(.tasks | length) > 0 and all(.tasks[]; any(.containers[]?; .name == $backend and .healthStatus == "HEALTHY"))')"
              fi
              if [ -n "$RELATIONSHIP_PATH" ]; then
                if curl --fail --silent --show-error --max-time 15 "$URL$RELATIONSHIP_PATH" >/dev/null; then
                  RELATIONSHIP_VERIFICATION_STATUS="verified"
                else
                  RELATIONSHIP_READY=false
                fi
              fi
            fi
            if [ "$ECS_READY" = "true" ] && [ "$COMPONENTS_READY" = "true" ] && [ "$TG_READY" = "true" ] && [ "$HTTP_READY" = "true" ] && [ "$BACKEND_COMPONENT_READY" = "true" ] && [ "$RELATIONSHIP_READY" = "true" ]; then break; fi
            if [ "$attempt" -eq 30 ]; then echo "The complete candidate component set, immutable images, routing, or frontend/backend relationship did not converge." >&2; exit 1; fi
            sleep 10
          done
          TARGET_STATES="$(printf '%s' "$TARGET_HEALTH" | jq -c '[.TargetHealthDescriptions[].TargetHealth.State] | sort')"
          HEALTHY_TARGET_COUNT="$(printf '%s' "$TARGET_HEALTH" | jq '[.TargetHealthDescriptions[] | select(.TargetHealth.State == "healthy")] | length')"
          CONFIGURATION_FINGERPRINT="$(jq -r '.configurationFingerprint' ../runtime-config.json)"
          CONFIGURATION_SNAPSHOT_ID="$(jq -r '.configurationSnapshotId' ../runtime-config.json)"
          DATABASE_BINDING_ID="$(jq -r '.managedDatabase.bindingId // empty' ../runtime-config.json)"
          CANDIDATE_LISTENER_RULE_ARN="$(terraform output -raw candidate_listener_rule_arn)"
          SECRET_REFERENCE_NAMES="$(jq -c '.secretReferences | keys | sort' ../runtime-config.json)"
          DATABASE_OUTPUTS="$(terraform output -json | jq -c '{database_internal_host:.database_internal_host.value,database_service_arn:.database_service_arn.value,database_cloud_map_service_arn:.database_cloud_map_service_arn.value,database_password_secret_arn:.database_password_secret_arn.value,database_url_secret_arn:.database_url_secret_arn.value,database_efs_file_system_id:.database_efs_file_system_id.value,database_efs_access_point_id:.database_efs_access_point_id.value} | with_entries(select(.value != null))')"
          COMPONENT_EVIDENCE="$(jq -cn --argjson contract "$COMPONENT_CONTRACT" --argjson images "$COMPONENT_IMAGES" --arg taskDefinitionArn "$TASK_DEFINITION_ARN" --arg serviceName "$SERVICE_NAME" --arg ecsServiceArn "$ECS_SERVICE_ARN" '[ $contract[] | . as $component | {id,role,root,buildContext,framework,frameworkMode,imageUri:$images[$component.id],imageDigest:($images[$component.id] | split("@") | .[1]),taskDefinitionArn:$taskDefinitionArn,serviceName:$serviceName,ecsServiceArn:$ecsServiceArn,port,healthPath,healthCheckMode:(.healthCheckMode // "http"),verified:true} ]')"
          RESULT="$(jq -cn --arg operation "$OPERATION_ID" --arg projectId "$PROJECT_ID" --arg generationId "$GENERATION_ID" --arg environmentName "$ENVIRONMENT_NAME" --arg url "$URL" --arg imageUri "$IMAGE_URI" --arg imageDigest "$IMAGE_DIGEST" --arg commit "$COMMIT_SHA" --arg cluster "$CLUSTER_NAME" --arg service "$SERVICE_NAME" --arg ecsServiceArn "$ECS_SERVICE_ARN" --arg targetGroupArn "$TARGET_GROUP_ARN" --arg candidateListenerRuleArn "$CANDIDATE_LISTENER_RULE_ARN" --arg taskDefinitionArn "$TASK_DEFINITION_ARN" --argjson appPort "$APP_PORT" --arg healthCheckPath "$HEALTH_CHECK_PATH" --arg configurationFingerprint "$CONFIGURATION_FINGERPRINT" --arg configurationSnapshotId "$CONFIGURATION_SNAPSHOT_ID" --arg databaseBindingId "$DATABASE_BINDING_ID" --arg relationshipVerificationStatus "$RELATIONSHIP_VERIFICATION_STATUS" --argjson secretReferenceNames "$SECRET_REFERENCE_NAMES" --argjson databaseOutputs "$DATABASE_OUTPUTS" --argjson healthyTargetCount "$HEALTHY_TARGET_COUNT" --argjson targetStates "$TARGET_STATES" --argjson components "$COMPONENT_EVIDENCE" '{contractVersion:"deployguard.candidate-result/v2",deploymentOperationId:$operation,projectId:$projectId,generationId:$generationId,environmentName:$environmentName,commitSha:$commit,candidateUrl:$url,imageUri:$imageUri,imageDigest:$imageDigest,components:$components,clusterName:$cluster,serviceName:$service,ecsServiceArn:$ecsServiceArn,targetGroupArn:$targetGroupArn,candidateListenerRuleArn:$candidateListenerRuleArn,taskDefinitionArn:$taskDefinitionArn,appPort:$appPort,healthCheckPath:$healthCheckPath,configurationFingerprint:$configurationFingerprint,configurationSnapshotId:$configurationSnapshotId,databaseBindingId:(if $databaseBindingId == "" then null else $databaseBindingId end),secretReferenceNames:$secretReferenceNames,databaseOutputs:$databaseOutputs,health:{ecsStable:true,expectedTaskDefinitionRunning:true,expectedImageRunning:true,componentSetVerified:true,frontendHttpVerified:true,backendComponentHealthVerified:true,relationshipVerificationStatus:$relationshipVerificationStatus,targetHealthVerified:true,candidateHttpVerified:true,healthyTargetCount:$healthyTargetCount,targetStates:$targetStates}}')"
          printf 'DEPLOYGUARD_CANDIDATE_RESULT=%s\n' "$RESULT"
          printf '%s\n' "$RESULT" | jq . > deployguard-result.json

      - name: Promote exact verified candidate and write result
        if: inputs.deployment_action == 'deploy' || inputs.deployment_action == 'rollback' || inputs.deployment_action == 'promote'
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ "$DEPLOYMENT_ACTION" = "promote" ]; then
            CANDIDATE="$(jq -c '.promotion.candidate' .deployguard/runtime-config.json)"
            INTENT_FINGERPRINT="$(jq -r '.promotion.intentFingerprint' .deployguard/runtime-config.json)"
          else
            CANDIDATE="$(jq -c . .deployguard/terraform/deployguard-result.json)"
            INTENT_WITHOUT_FINGERPRINT="$(jq -c --argjson candidate "$CANDIDATE" '.promotion | .candidate = $candidate | del(.intentFingerprint)' .deployguard/runtime-config.json)"
            INTENT_FINGERPRINT="$(printf '%s' "$INTENT_WITHOUT_FINGERPRINT" | sha256sum | awk '{print $1}')"
          fi
          TARGET_GROUP_ARN="$(printf '%s' "$CANDIDATE" | jq -r '.targetGroupArn')"
          CANDIDATE_RULE_ARN="$(printf '%s' "$CANDIDATE" | jq -r '.candidateListenerRuleArn')"
          CLUSTER_NAME="$(printf '%s' "$CANDIDATE" | jq -r '.clusterName')"
          SERVICE_NAME="$(printf '%s' "$CANDIDATE" | jq -r '.serviceName')"
          TASK_DEFINITION_ARN="$(printf '%s' "$CANDIDATE" | jq -r '.taskDefinitionArn')"
          IMAGE_URI="$(printf '%s' "$CANDIDATE" | jq -r '.imageUri')"
          EXPECTED_COMPONENT_IMAGES="$(printf '%s' "$CANDIDATE" | jq -c 'if ((.components // []) | length) > 0 then (.components | map({key:.id,value:.imageUri}) | from_entries) else {app:.imageUri} end')"
          FULL_STACK="$(printf '%s' "$CANDIDATE" | jq -r '([(.components // [])[] | select(.role == "frontend")] | length) == 1 and ([(.components // [])[] | select(.role == "backend")] | length) == 1')"
          PLAN_FULL_STACK="$(jq -r '([(.components // [])[] | select(.role == "frontend")] | length) == 1 and ([(.components // [])[] | select(.role == "backend")] | length) == 1' .deployguard/build-plan.json)"
          URL="$(printf '%s' "$CANDIDATE" | jq -r '.candidateUrl')"
          RELATIONSHIP_PATH="$(jq -r '.relationships[0].verificationPath // empty' .deployguard/build-plan.json)"
          RELATIONSHIP_VERIFICATION_STATUS="$(printf '%s' "$CANDIDATE" | jq -r '.health.relationshipVerificationStatus // empty')"
          http_liveness() {
            local status
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$1" || true)"
            [[ "$status" =~ ^[234][0-9][0-9]$ ]]
          }
          [ "$FULL_STACK" = "$PLAN_FULL_STACK" ] || { echo "Candidate component shape does not match the immutable BuildPlan." >&2; exit 1; }
          if [ "$PLAN_FULL_STACK" = "true" ]; then
            if [ -n "$RELATIONSHIP_PATH" ]; then
              [ "$RELATIONSHIP_VERIFICATION_STATUS" = "verified" ] || { echo "Candidate relationship evidence does not match the immutable BuildPlan." >&2; exit 1; }
            else
              [ "$RELATIONSHIP_VERIFICATION_STATUS" = "not_required" ] || { echo "Candidate relationship evidence does not match the immutable BuildPlan." >&2; exit 1; }
            fi
          else
            [ "$RELATIONSHIP_VERIFICATION_STATUS" = "not_required" ] || { echo "Non-full-stack candidate cannot claim relationship endpoint verification." >&2; exit 1; }
          fi
          TARGET_TAGS="$(aws elbv2 describe-tags --resource-arns "$TARGET_GROUP_ARN" --output json)"
          printf '%s' "$TARGET_TAGS" | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" --arg generation "$GENERATION_ID" '
            (.TagDescriptions[0].Tags | map({key:.Key,value:.Value}) | from_entries) as $tags
            | $tags.ManagedBy == "DeployGuard" and $tags.DeployGuardProjectId == $project
              and $tags.Environment == $environment and $tags.DeployGuardGenerationId == $generation
              and $tags.DeployGuardResource == "app-target-group"
          ' >/dev/null || { echo "Promotion candidate target group is not owned by the exact immutable generation." >&2; exit 1; }
          for attempt in $(seq 1 30); do
            SERVICE="$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" --output json)"
            TASK_DEFINITION="$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION_ARN" --output json)"
            COMPONENTS_READY="$(jq -n --argjson expected "$EXPECTED_COMPONENT_IMAGES" --argjson actual "$(printf '%s' "$TASK_DEFINITION" | jq '.taskDefinition.containerDefinitions | map({key:.name,value:.image}) | from_entries')" '$expected == $actual')"
            TARGET_HEALTH="$(aws elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" --output json)"
            ECS_READY="$(printf '%s' "$SERVICE" | jq -r --arg task "$TASK_DEFINITION_ARN" '(.services | length) == 1 and .services[0].taskDefinition == $task and .services[0].desiredCount > 0 and .services[0].runningCount == .services[0].desiredCount and (.services[0].pendingCount // 0) == 0 and any(.services[0].deployments[]?; .status == "PRIMARY" and .rolloutState == "COMPLETED" and .taskDefinition == $task)')"
            TG_READY="$(printf '%s' "$TARGET_HEALTH" | jq -r '(.TargetHealthDescriptions | length) > 0 and all(.TargetHealthDescriptions[]; .TargetHealth.State == "healthy")')"
            HTTP_READY=false; if http_liveness "$URL$HEALTH_CHECK_PATH"; then HTTP_READY=true; fi
            RELATIONSHIP_READY=true
            BACKEND_COMPONENT_READY=true
            if [ "$FULL_STACK" = "true" ]; then
              BACKEND_ID="$(printf '%s' "$CANDIDATE" | jq -r '.components[] | select(.role == "backend") | .id')"
              TASK_ARNS="$(aws ecs list-tasks --cluster "$CLUSTER_NAME" --service-name "$SERVICE_NAME" --desired-status RUNNING --output json | jq -c '.taskArns')"
              BACKEND_COMPONENT_READY=false
              if [ "$(printf '%s' "$TASK_ARNS" | jq 'length')" -gt 0 ]; then
                TASKS="$(aws ecs describe-tasks --cluster "$CLUSTER_NAME" --tasks $(printf '%s' "$TASK_ARNS" | jq -r '.[]') --output json)"
                BACKEND_COMPONENT_READY="$(printf '%s' "$TASKS" | jq -r --arg backend "$BACKEND_ID" '(.tasks | length) > 0 and all(.tasks[]; any(.containers[]?; .name == $backend and .healthStatus == "HEALTHY"))')"
              fi
              RELATIONSHIP_PATH="$(jq -r '.relationships[0].verificationPath // empty' .deployguard/build-plan.json)"
              if [ -n "$RELATIONSHIP_PATH" ] && ! curl --fail --silent --show-error --max-time 15 "$URL$RELATIONSHIP_PATH" >/dev/null; then RELATIONSHIP_READY=false; fi
            fi
            if [ "$ECS_READY" = "true" ] && [ "$COMPONENTS_READY" = "true" ] && [ "$TG_READY" = "true" ] && [ "$HTTP_READY" = "true" ] && [ "$BACKEND_COMPONENT_READY" = "true" ] && [ "$RELATIONSHIP_READY" = "true" ]; then break; fi
            if [ "$attempt" -eq 30 ]; then echo "Candidate ceased to be healthy before promotion." >&2; exit 1; fi
            sleep 10
          done
          LISTENER_ARN="$(jq -r '.platformFoundation.listenerArn' .deployguard/runtime-config.json)"
          PRODUCTION_HOST="$(jq -r '.routing.productionHost' .deployguard/runtime-config.json)"
          PRODUCTION_PRIORITY="$(jq -r '.routing.listenerPriority' .deployguard/runtime-config.json)"
          EXPECTED_PREVIOUS_RULE_ARN="$(jq -r '.promotion.previousListenerRuleArn // empty' .deployguard/runtime-config.json)"
          EXISTING_RULE_ARN="$(aws elbv2 describe-rules --listener-arn "$LISTENER_ARN" --output json | jq -r --arg priority "$PRODUCTION_PRIORITY" '.Rules[]? | select(.Priority == $priority) | .RuleArn' | head -1)"
          if [ -n "$EXISTING_RULE_ARN" ]; then
            [ -n "$EXPECTED_PREVIOUS_RULE_ARN" ] && [ "$EXISTING_RULE_ARN" = "$EXPECTED_PREVIOUS_RULE_ARN" ] || { echo "Stable route does not match the authoritative previous route." >&2; exit 1; }
            RULE_TAGS="$(aws elbv2 describe-tags --resource-arns "$EXISTING_RULE_ARN" --output json)"
            printf '%s' "$RULE_TAGS" | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" '(.TagDescriptions[0].Tags | map({key:.Key,value:.Value}) | from_entries) as $tags | $tags.ManagedBy == "DeployGuard" and $tags.DeployGuardProjectId == $project and $tags.Environment == $environment and $tags.DeployGuardScope == "project"' >/dev/null || { echo "Stable route is not project-owned." >&2; exit 1; }
            aws elbv2 modify-rule --rule-arn "$EXISTING_RULE_ARN" --actions "Type=forward,TargetGroupArn=$TARGET_GROUP_ARN" --conditions "Field=host-header,Values=$PRODUCTION_HOST" >/dev/null
            STABLE_RULE_ARN="$EXISTING_RULE_ARN"
          else
            [ -z "$EXPECTED_PREVIOUS_RULE_ARN" ] || { echo "The authoritative previous stable route is unexpectedly absent." >&2; exit 1; }
            STABLE_RULE_ARN="$(aws elbv2 create-rule --listener-arn "$LISTENER_ARN" --priority "$PRODUCTION_PRIORITY" --actions "Type=forward,TargetGroupArn=$TARGET_GROUP_ARN" --conditions "Field=host-header,Values=$PRODUCTION_HOST" --tags "Key=ManagedBy,Value=DeployGuard" "Key=DeployGuardProjectId,Value=$PROJECT_ID" "Key=Environment,Value=$ENVIRONMENT_NAME" "Key=DeployGuardScope,Value=project" --output json | jq -r '.Rules[0].RuleArn')"
          fi
          PRODUCTION_URL="http://$PRODUCTION_HOST"
          ROUTE_VERIFIED=false
          for attempt in $(seq 1 30); do
            STABLE_RULE="$(aws elbv2 describe-rules --rule-arns "$STABLE_RULE_ARN" --output json)"
            RULE_READY="$(printf '%s' "$STABLE_RULE" | jq -r --arg host "$PRODUCTION_HOST" --arg target "$TARGET_GROUP_ARN" '
              (.Rules | length) == 1
              and any(.Rules[0].Conditions[]?; .Field == "host-header" and any(.Values[]?; . == $host))
              and any(.Rules[0].Actions[]?; .Type == "forward" and ((.TargetGroupArn // .ForwardConfig.TargetGroups[0].TargetGroupArn) == $target))
            ')"
            HTTP_READY=false
            if [ "$RULE_READY" = "true" ] && http_liveness "$PRODUCTION_URL$HEALTH_CHECK_PATH"; then
              HTTP_READY=true
            fi
            if [ "$HTTP_READY" = "true" ] && [ "$FULL_STACK" = "true" ]; then
              RELATIONSHIP_PATH="$(jq -r '.relationships[0].verificationPath // empty' .deployguard/build-plan.json)"
              if [ -n "$RELATIONSHIP_PATH" ] && ! curl --fail --silent --show-error --max-time 15 "$PRODUCTION_URL$RELATIONSHIP_PATH" >/dev/null; then HTTP_READY=false; fi
            fi
            if [ "$RULE_READY" = "true" ] && [ "$HTTP_READY" = "true" ]; then
              ROUTE_VERIFIED=true
              break
            fi
            sleep 5
          done
          [ "$ROUTE_VERIFIED" = "true" ] || { echo "Production route did not converge after exact candidate cutover." >&2; exit 1; }
          CANDIDATE_RULE_TAGS="$(aws elbv2 describe-tags --resource-arns "$CANDIDATE_RULE_ARN" --output json)"
          printf '%s' "$CANDIDATE_RULE_TAGS" | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" --arg generation "$GENERATION_ID" '(.TagDescriptions[0].Tags | map({key:.Key,value:.Value}) | from_entries) as $tags | $tags.ManagedBy == "DeployGuard" and $tags.DeployGuardProjectId == $project and $tags.Environment == $environment and $tags.DeployGuardGenerationId == $generation and $tags.DeployGuardResource == "candidate-route"' >/dev/null || { echo "Candidate route is not owned by the exact immutable generation." >&2; exit 1; }
          aws elbv2 delete-rule --rule-arn "$CANDIDATE_RULE_ARN" >/dev/null
          CANDIDATE_RULE_ERROR="$(mktemp)"
          if aws elbv2 describe-rules --rule-arns "$CANDIDATE_RULE_ARN" >/dev/null 2>"$CANDIDATE_RULE_ERROR"; then
            echo "Candidate route remains after successful promotion." >&2
            exit 1
          fi
          grep -Eq 'ListenerRuleNotFound|RuleNotFound' "$CANDIDATE_RULE_ERROR" || { sed -n '1,20p' "$CANDIDATE_RULE_ERROR" >&2; exit 1; }
          rm -f "$CANDIDATE_RULE_ERROR"
          RESULT="$(printf '%s' "$CANDIDATE" | jq -c --arg url "$PRODUCTION_URL" --arg listenerRuleArn "$STABLE_RULE_ARN" --arg intentFingerprint "$INTENT_FINGERPRINT" '{contractVersion:"deployguard.deployment-result/v2",deploymentOperationId,generationId,environmentName,status:"succeeded",deployedUrl:$url,imageUri,imageDigest,components:(.components // []),commitSha,clusterName,serviceName,ecsServiceArn,targetGroupArn,listenerRuleArn:$listenerRuleArn,routingVerified:true,candidateRouteRemoved:true,taskDefinitionArn,appPort,healthCheckPath,configurationFingerprint,configurationSnapshotId,databaseBindingId,secretReferenceNames,databaseOutputs,promotionIntentFingerprint:$intentFingerprint}')"
          printf 'DEPLOYGUARD_RELEASE_RESULT=%s\n' "$RESULT"
          mkdir -p .deployguard/terraform
          printf '%s\n' "$RESULT" | jq . > .deployguard/terraform/deployguard-result.json

      - name: Compensate stable route after failed authoritative promotion
        if: inputs.deployment_action == 'compensate'
        shell: bash
        run: |
          set -euo pipefail
          INTENT_FINGERPRINT="$(jq -r '.promotion.intentFingerprint' .deployguard/runtime-config.json)"
          LISTENER_ARN="$(jq -r '.platformFoundation.listenerArn' .deployguard/runtime-config.json)"
          PRODUCTION_PRIORITY="$(jq -r '.routing.listenerPriority' .deployguard/runtime-config.json)"
          PREVIOUS_TARGET="$(jq -r '.promotion.previousTargetGroupArn // empty' .deployguard/runtime-config.json)"
          PREVIOUS_GENERATION="$(jq -r '.promotion.previousLiveGenerationId // empty' .deployguard/runtime-config.json)"
          PREVIOUS_URL="$(jq -r '.promotion.previousProductionUrl // empty' .deployguard/runtime-config.json)"
          RULE_ARN="$(aws elbv2 describe-rules --listener-arn "$LISTENER_ARN" --output json | jq -r --arg priority "$PRODUCTION_PRIORITY" '.Rules[]? | select(.Priority == $priority) | .RuleArn' | head -1)"
          if [ -z "$RULE_ARN" ] && [ -n "$PREVIOUS_TARGET" ]; then echo "The route requiring compensation is missing." >&2; exit 1; fi
          if [ -z "$RULE_ARN" ]; then
            MODE="removed_first_release_route"
            RESULT="$(jq -cn --arg operation "$OPERATION_ID" --arg generationId "$GENERATION_ID" --arg intentFingerprint "$INTENT_FINGERPRINT" --arg mode "$MODE" '{contractVersion:"deployguard.promotion-compensation/v1",deploymentOperationId:$operation,generationId:$generationId,intentFingerprint:$intentFingerprint,status:"compensated",mode:$mode}')"
            printf 'DEPLOYGUARD_COMPENSATION_RESULT=%s\n' "$RESULT"
            mkdir -p .deployguard/terraform
            printf '%s\n' "$RESULT" | jq . > .deployguard/terraform/deployguard-result.json
            exit 0
          fi
          RULE_TAGS="$(aws elbv2 describe-tags --resource-arns "$RULE_ARN" --output json)"
          printf '%s' "$RULE_TAGS" | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" '(.TagDescriptions[0].Tags | map({key:.Key,value:.Value}) | from_entries) as $tags | $tags.ManagedBy == "DeployGuard" and $tags.DeployGuardProjectId == $project and $tags.Environment == $environment and $tags.DeployGuardScope == "project"' >/dev/null || { echo "Compensation route is not project-owned." >&2; exit 1; }
          if [ -n "$PREVIOUS_TARGET" ]; then
            PREVIOUS_TARGET_TAGS="$(aws elbv2 describe-tags --resource-arns "$PREVIOUS_TARGET" --output json)"
            printf '%s' "$PREVIOUS_TARGET_TAGS" | jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" --arg generation "$PREVIOUS_GENERATION" '
              (.TagDescriptions[0].Tags | map({key:.Key,value:.Value}) | from_entries) as $tags
              | $tags.ManagedBy == "DeployGuard" and $tags.DeployGuardProjectId == $project
                and $tags.Environment == $environment and $tags.DeployGuardGenerationId == $generation
                and $tags.DeployGuardResource == "app-target-group"
            ' >/dev/null || { echo "Previous LIVE target is not owned by the authoritative previous generation." >&2; exit 1; }
            aws elbv2 modify-rule --rule-arn "$RULE_ARN" --actions "Type=forward,TargetGroupArn=$PREVIOUS_TARGET" >/dev/null
            [ -z "$PREVIOUS_URL" ] || curl --fail --silent --show-error --max-time 15 "$PREVIOUS_URL$HEALTH_CHECK_PATH" >/dev/null || { echo "Previous LIVE route did not recover." >&2; exit 1; }
            MODE="restored_previous_live"
          else
            aws elbv2 delete-rule --rule-arn "$RULE_ARN" >/dev/null
            MODE="removed_first_release_route"
          fi
          RESULT="$(jq -cn --arg operation "$OPERATION_ID" --arg generationId "$GENERATION_ID" --arg intentFingerprint "$INTENT_FINGERPRINT" --arg mode "$MODE" '{contractVersion:"deployguard.promotion-compensation/v1",deploymentOperationId:$operation,generationId:$generationId,intentFingerprint:$intentFingerprint,status:"compensated",mode:$mode}')"
          printf 'DEPLOYGUARD_COMPENSATION_RESULT=%s\n' "$RESULT"
          mkdir -p .deployguard/terraform
          printf '%s\n' "$RESULT" | jq . > .deployguard/terraform/deployguard-result.json

      - name: Clean exact generation independently
        # The backend supplies an exact retired or terminally failed-candidate
        # state identity. This action never receives project-persistence state.
        if: inputs.deployment_action == 'cleanup'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          RETIRED_GENERATION_ID="$(jq -r '.retiredGenerationCleanup.generationId // empty' .deployguard/runtime-config.json)"
          [ -n "$RETIRED_GENERATION_ID" ] || exit 0
          RETIRED_STATE_KEY="$(jq -r '.retiredGenerationCleanup.terraformStateKey' .deployguard/runtime-config.json)"
          EXPECTED_STATE_KEY="projects/$PROJECT_ID/$ENVIRONMENT_NAME/$RETIRED_GENERATION_ID/terraform.tfstate"
          [ "$RETIRED_STATE_KEY" = "$EXPECTED_STATE_KEY" ] || { echo "Generation cleanup state identity mismatch." >&2; exit 1; }
          mkdir -p .deployguard/retired-terraform
          cp .deployguard/terraform/main.tf .deployguard/retired-terraform/main.tf
          jq --arg generation "$RETIRED_GENERATION_ID" \
            --arg namespace "/deployguard/$PROJECT_ID/$ENVIRONMENT_NAME/$RETIRED_GENERATION_ID" \
            '.generation_id=$generation | .infrastructure_namespace=$namespace | .image_uri="destroy.invalid"' \
            .deployguard/terraform/terraform.tfvars.json > .deployguard/retired-terraform/terraform.tfvars.json
          set +e
          (
            set -euo pipefail
            terraform -chdir=.deployguard/retired-terraform fmt -check -recursive
            terraform -chdir=.deployguard/retired-terraform init -input=false \
              -backend-config="bucket=$TERRAFORM_STATE_BUCKET" \
              -backend-config="key=$RETIRED_STATE_KEY" \
              -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
            terraform -chdir=.deployguard/retired-terraform validate -no-color
            terraform -chdir=.deployguard/retired-terraform plan -destroy -input=false -no-color -out=cleanup.tfplan
            terraform -chdir=.deployguard/retired-terraform show -json cleanup.tfplan > .deployguard/retired-terraform/cleanup-plan.json
            jq -e --arg project "$PROJECT_ID" --arg environment "$ENVIRONMENT_NAME" --arg generation "$RETIRED_GENERATION_ID" '
              [ .resource_changes[]? | select(
                  any(.change.actions[]?; . == "create" or . == "update")
                  or ((.change.before.tags // {}) as $tags
                    | ($tags | length) > 0 and (
                        $tags.ManagedBy != "DeployGuard"
                        or $tags.DeployGuardProjectId != $project
                        or $tags.Environment != $environment
                        or $tags.DeployGuardGenerationId != $generation))
                ) ] | length == 0
            ' .deployguard/retired-terraform/cleanup-plan.json >/dev/null
            terraform -chdir=.deployguard/retired-terraform apply -input=false -auto-approve cleanup.tfplan
            # A retired generation owns its exact state object as well as its
            # infrastructure. Remove every version and lock marker for only
            # that immutable key before reporting CLEANED.
            for attempt in $(seq 1 20); do
              aws s3api list-object-versions --bucket "$TERRAFORM_STATE_BUCKET" --prefix "$RETIRED_STATE_KEY" --output json \
                | jq -c --arg state "$RETIRED_STATE_KEY" '
                    {Objects: (([.Versions[]?, .DeleteMarkers[]?]
                      | map(select(.Key == $state or .Key == ($state + ".tflock")) | {Key,VersionId}))[:1000]), Quiet:true}
                  ' > .deployguard/retired-terraform/state-delete.json
              [ "$(jq '.Objects | length' .deployguard/retired-terraform/state-delete.json)" -gt 0 ] || break
              aws s3api delete-objects --bucket "$TERRAFORM_STATE_BUCKET" --delete file://.deployguard/retired-terraform/state-delete.json >/dev/null
            done
            aws s3api list-object-versions --bucket "$TERRAFORM_STATE_BUCKET" --prefix "$RETIRED_STATE_KEY" --output json \
              | jq -e --arg state "$RETIRED_STATE_KEY" '
                  [.Versions[]?, .DeleteMarkers[]?]
                  | map(select(.Key == $state or .Key == ($state + ".tflock")))
                  | length == 0
                ' >/dev/null
          )
          CLEANUP_EXIT="$?"
          set -e
          if [ "$CLEANUP_EXIT" -eq 0 ]; then
            CLEANUP_STATUS="cleaned"
            CLEANUP_ERROR=""
          else
            CLEANUP_STATUS="cleanup_pending"
            CLEANUP_ERROR="Generation cleanup did not converge; authoritative LIVE and project-persistence resources were not affected."
          fi
          CLEANUP_RESULT="$(jq -cn --arg generationId "$RETIRED_GENERATION_ID" --arg status "$CLEANUP_STATUS" --arg error "$CLEANUP_ERROR" '{generationId:$generationId,status:$status,error:(if $error == "" then null else $error end)}')"
          printf 'DEPLOYGUARD_GENERATION_CLEANUP_RESULT=%s\n' "$CLEANUP_RESULT"
          exit 0

      - name: Verify exact project deletion and write result
        if: inputs.deployment_action == 'destroy'
        working-directory: .deployguard/terraform
        shell: bash
        run: |
          set -euo pipefail
          printf 'DEPLOYGUARD_STAGE=verify_exact_project_deletion\n'
          jq -r '.projectDeletion.generations[].terraformStateKey, .projectDeletion.projectResources.terraformStateKey' ../runtime-config.json > exact-state-keys.txt
          while IFS= read -r state_key; do
            [ -n "$state_key" ] || continue
            case "$state_key" in
              "projects/$PROJECT_ID/$ENVIRONMENT_NAME/"*/terraform.tfstate|"projects/$PROJECT_ID/$ENVIRONMENT_NAME/project/terraform.tfstate") ;;
              *) echo "Refusing unexpected Terraform state key $state_key." >&2; exit 1 ;;
            esac
            for attempt in $(seq 1 20); do
              aws s3api list-object-versions --bucket "$TERRAFORM_STATE_BUCKET" --prefix "$state_key" --output json \
                | jq -c --arg state "$state_key" '{
                    Objects: (([.Versions[]?, .DeleteMarkers[]?]
                      | map(select(.Key == $state or .Key == ($state + ".tflock")) | {Key,VersionId}))[:1000]),
                    Quiet:true
                  }' > exact-state-delete.json
              [ "$(jq '.Objects | length' exact-state-delete.json)" -gt 0 ] || break
              aws s3api delete-objects --bucket "$TERRAFORM_STATE_BUCKET" --delete file://exact-state-delete.json >/dev/null
            done
            aws s3api list-object-versions --bucket "$TERRAFORM_STATE_BUCKET" --prefix "$state_key" --output json \
              | jq -e --arg state "$state_key" '
                  [.Versions[]?, .DeleteMarkers[]?]
                  | map(select(.Key == $state or .Key == ($state + ".tflock")))
                  | length == 0
                ' >/dev/null || { echo "Exact Terraform state artifacts remain for $state_key." >&2; exit 1; }
          done < exact-state-keys.txt

          REPOSITORY_NAME="$(jq -r '.projectDeletion.projectResources.ecrRepositoryName' ../runtime-config.json)"
          ECR_ERROR="$(mktemp)"
          if aws ecr describe-repositories --repository-names "$REPOSITORY_NAME" >/dev/null 2>"$ECR_ERROR"; then
            echo "Exact project ECR repository remains." >&2
            exit 1
          elif ! grep -q 'RepositoryNotFoundException' "$ECR_ERROR"; then
            sed -n '1,20p' "$ECR_ERROR" >&2
            exit 1
          fi
          rm -f "$ECR_ERROR"

          RUNTIME_SECRET="$(jq -r '.projectDeletion.projectResources.runtimeSecretName' ../runtime-config.json)"
          SECRET_ERROR="$(mktemp)"
          if SECRET="$(aws secretsmanager describe-secret --secret-id "$RUNTIME_SECRET" --output json 2>"$SECRET_ERROR")"; then
            [ -n "$(printf '%s' "$SECRET" | jq -r '.DeletedDate // empty')" ] || {
              echo "Exact project runtime secret remains active." >&2
              exit 1
            }
          elif ! grep -q 'ResourceNotFoundException' "$SECRET_ERROR"; then
            sed -n '1,20p' "$SECRET_ERROR" >&2
            exit 1
          fi
          rm -f "$SECRET_ERROR"

          GENERATION_IDS="$(jq -c '[.projectDeletion.generations[].generationId] | unique | sort' ../runtime-config.json)"
          RESULT="$(jq -cn \
            --arg operation "$OPERATION_ID" \
            --arg projectId "$PROJECT_ID" \
            --arg environmentName "$ENVIRONMENT_NAME" \
            --argjson generationIds "$GENERATION_IDS" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{contractVersion:"deployguard.destroy-result/v2",deploymentOperationId:$operation,projectId:$projectId,environmentName:$environmentName,generationIds:$generationIds,status:"project_delete_ready",generationResourcesRemoved:true,projectResourcesRemoved:true,terraformStateArtifactsRemoved:true,sharedPlatformUntouched:true,verifiedAt:$verifiedAt}')"
          printf 'DEPLOYGUARD_DESTROY_RESULT=%s\n' "$RESULT"
          printf '%s\n' "$RESULT" | jq . > deployguard-result.json

      - name: Upload DeployGuard result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployguard-result-${{ inputs.deployment_operation_id }}
          path: |
            .deployguard/terraform/deployguard-result.json
            .deployguard/terraform/deployguard-cost-plan.json
            .deployguard/project-terraform/deployguard-project-cost-plan.json
          retention-days: 30
