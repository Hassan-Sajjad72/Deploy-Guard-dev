              fi
            elif [ -n "$CONFIG_FILE" ]; then
              while IFS= read -r key; do
                value="$(jq -r --arg key "$key" '.[$key]' "$CONFIG_FILE")"
                BUILD_ARGS+=(--build-arg "$key=$value")
              done < <(jq -r 'keys[]' "$CONFIG_FILE")
            fi
            if [ "$(printf '%s' "$component" | jq -r '.dockerStrategy == "generated"')" = "true" ] && grep -q 'id=deployguard_runtime_config' Dockerfile; then
              BUILD_RUNTIME_CONFIG="$(mktemp "$RUNNER_TEMP/deployguard-runtime-build.XXXXXX")"
              chmod 600 "$BUILD_RUNTIME_CONFIG"
              COMPONENT="$component" BUILD_RUNTIME_CONFIG="$BUILD_RUNTIME_CONFIG" node <<'NODE'
              const { execFileSync } = require("child_process");
              const fs = require("fs");
              const runtime = JSON.parse(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/.deployguard/runtime-config.json`, "utf8"));
              const component = JSON.parse(process.env.COMPONENT || "{}");
              const legacyDjangoCollectstatic = component.language === "python"
                && component.framework === "django"
                && /(?:^|\s)manage\.py\s+collectstatic(?:\s|$)/.test(String(component.buildCommand || ""));
              const initialization = component.buildInitialization?.mode || (legacyDjangoCollectstatic ? "runtime_placeholders" : "none");
              if (initialization === "external_service_required") {
                throw new Error("The immutable build command requires a live external service and must be deferred to the post-provision/release phase.");
              }
              const ownership = Array.isArray(component.environmentOwnership) ? component.environmentOwnership : [];
              const componentKeys = new Set(ownership
                .filter((item) => item && item.source !== "managed_database")
                .map((item) => String(item.key || ""))
                .filter(Boolean));
              const hasComponentOwnership = componentKeys.size > 0;
              const values = Object.fromEntries(Object.entries(runtime.environment || {})
                .filter(([key]) => !hasComponentOwnership || componentKeys.has(key)));
              const managed = runtime.managedDatabase || null;
              const aliases = {
                host: ["DB_HOST", "DATABASE_HOST", "POSTGRES_HOST", "PGHOST", "MYSQL_HOST", "MONGO_HOST", "MONGODB_HOST"],
                port: ["DB_PORT", "DATABASE_PORT", "POSTGRES_PORT", "PGPORT", "MYSQL_PORT", "MONGO_PORT", "MONGODB_PORT"],
                username: ["DB_USER", "DATABASE_USER", "POSTGRES_USER", "PGUSER", "MYSQL_USER", "MONGO_USER", "MONGODB_USER"],
                password: ["DB_PASSWORD", "DATABASE_PASSWORD", "POSTGRES_PASSWORD", "PGPASSWORD", "MYSQL_PASSWORD", "MONGO_PASSWORD", "MONGODB_PASSWORD"],
                database: ["DB_NAME", "DATABASE_NAME", "POSTGRES_DB", "PGDATABASE", "MYSQL_DATABASE", "MONGO_DB", "MONGODB_DATABASE"],
                url: ["DATABASE_URL", "POSTGRES_URL", "POSTGRESQL_URL", "MYSQL_URL", "MONGO_URL", "MONGODB_URI"],
              };
              const propertyFor = (key) => Object.entries(aliases).find(([, keys]) => keys.includes(key))?.[0] || null;
              const databaseKeys = new Set();
              if (managed) {
                for (const keys of Object.values(aliases)) for (const key of keys) databaseKeys.add(key);
                for (const key of Object.keys(managed.runtimeAliases || {})) databaseKeys.add(key);
                for (const key of Object.keys(managed.secretAliases || {})) databaseKeys.add(key);
                for (const item of ownership) if (item?.source === "managed_database" && item.key) databaseKeys.add(String(item.key));
              }
              const buildHost = "deployguard-build-init.invalid";
              const buildUser = "deployguard_build_init";
              const buildPassword = "deployguard-build-init-placeholder";
              const buildDatabase = "deployguard_build_init";
              const buildPort = String(managed?.port || 5432);
              const buildUrl = managed
                ? `${managed.urlScheme}://${encodeURIComponent(buildUser)}:${encodeURIComponent(buildPassword)}@${buildHost}:${buildPort}/${buildDatabase}${managed.urlQuery || ""}`
                : null;
              const placeholder = (key) => {
                const property = propertyFor(key);
                if (property === "host") return buildHost;
                if (property === "port") return buildPort;
                if (property === "username") return buildUser;
                if (property === "database") return buildDatabase;
                if (property === "url") return buildUrl || "deployguard-build-init-placeholder";
                return buildPassword;
              };
              for (const key of databaseKeys) delete values[key];
              const secretCache = new Map();
              for (const [name, reference] of Object.entries(runtime.secretReferences || {})) {
                if (databaseKeys.has(name)) continue;
                if (hasComponentOwnership && !componentKeys.has(name)) continue;
                const segments = String(reference).split(":");
                const field = segments.at(-3);
                const secretArn = segments.slice(0, -3).join(":");
                if (!field || !secretArn.startsWith("arn:")) throw new Error("The immutable runtime secret reference is invalid for build initialization.");
                let secret = secretCache.get(secretArn);
                if (!secret) {
                  try {
                    secret = JSON.parse(execFileSync("aws", ["secretsmanager", "get-secret-value", "--secret-id", secretArn, "--query", "SecretString", "--output", "text"], { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }));
                  } catch {
                    throw new Error("DeployGuard could not read an immutable runtime secret for build initialization.");
                  }
                  secretCache.set(secretArn, secret);
                }
                if (typeof secret[field] !== "string") throw new Error("The immutable runtime secret is missing a required build-initialization value.");
                values[name] = secret[field];
              }
              if (initialization === "runtime_placeholders") {
                for (const key of databaseKeys) values[key] = placeholder(key);
              }
              fs.writeFileSync(process.env.BUILD_RUNTIME_CONFIG, JSON.stringify(values), { mode: 0o600 });
          NODE
              BUILD_SECRET_ARGS+=(--secret "id=deployguard_runtime_config,src=$BUILD_RUNTIME_CONFIG")
            fi
            if docker buildx version >/dev/null 2>&1 && docker buildx build --help 2>&1 | grep -q -- '--check'; then
              docker buildx build --check -f "$DOCKERFILE_PATH" "${BUILD_ARGS[@]}" "${BUILD_SECRET_ARGS[@]}" "$DOCKER_BUILD_CONTEXT"
            else
              echo "Docker Buildx --check is unavailable on this runner; the validated contract and real Docker build remain authoritative."
            fi
            if [ "${#BUILD_SECRET_ARGS[@]}" -gt 0 ]; then
              docker buildx build --load --pull -f "$DOCKERFILE_PATH" "${BUILD_ARGS[@]}" "${BUILD_SECRET_ARGS[@]}" -t "$TAGGED_URI" "$DOCKER_BUILD_CONTEXT"
              rm -f "$BUILD_RUNTIME_CONFIG"
              BUILD_RUNTIME_CONFIG=""
            else
              docker build --pull -f "$DOCKERFILE_PATH" "${BUILD_ARGS[@]}" -t "$TAGGED_URI" "$DOCKER_BUILD_CONTEXT"
            fi
            RUNTIME_USER="$(docker image inspect "$TAGGED_URI" --format '{{.Config.User}}')"
            case "$RUNTIME_USER" in ""|0|root|0:0|root:root) echo "The immutable runtime image must declare a non-root user." >&2; exit 1;; esac
            docker push "$TAGGED_URI"
            IMAGE_DIGEST="$(aws ecr describe-images --repository-name "${{ steps.release.outputs.repository_name }}" --image-ids imageTag="$COMPONENT_TAG" --query 'imageDetails[0].imageDigest' --output text)"
            [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "The immutable image digest could not be resolved for $COMPONENT_ID." >&2; exit 1; }
            IMMUTABLE_URI="$REGISTRY/${{ steps.release.outputs.repository_name }}@$IMAGE_DIGEST"
            COMPONENT_IMAGES="$(printf '%s' "$COMPONENT_IMAGES" | jq -c --argjson component "$component" --arg uri "$IMMUTABLE_URI" --arg digest "$IMAGE_DIGEST" '. + [$component + {imageUri:$uri,imageDigest:$digest}]')"
          done < <(jq -c '.[]' "$COMPONENTS_FILE")
          PRIMARY="$(printf '%s' "$COMPONENT_IMAGES" | jq -c 'map(select(.role == "frontend"))[0] // .[0]')"
          printf '%s\n' "$COMPONENT_IMAGES" > "$GITHUB_WORKSPACE/.deployguard/component-images.json"
          echo "digest=$(printf '%s' "$PRIMARY" | jq -r '.imageDigest')" >> "$GITHUB_OUTPUT"
          echo "uri=$(printf '%s' "$PRIMARY" | jq -r '.imageUri')" >> "$GITHUB_OUTPUT"
          echo "components=$(printf '%s' "$COMPONENT_IMAGES" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Execute immutable application contract before AWS mutation
        if: inputs.deployment_action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          PREFLIGHT_ID="dg-preflight-${OPERATION_ID:0:8}-${GITHUB_RUN_ID}"
          PREFLIGHT_ATTEMPTS="${DEPLOYGUARD_PREFLIGHT_ATTEMPTS:-60}"
          NETWORK="$PREFLIGHT_ID"
          ENV_DIR="$(mktemp -d "$RUNNER_TEMP/deployguard-preflight-env.XXXXXX")"
          CONTAINERS=()
          cleanup_executable_preflight() {
            for container in "${CONTAINERS[@]}"; do docker rm -f "$container" >/dev/null 2>&1 || true; done
            docker network rm "$NETWORK" >/dev/null 2>&1 || true
            rm -rf "$ENV_DIR"
