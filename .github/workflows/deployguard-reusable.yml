              DOCKERFILE_PATH="$GENERATED_DOCKERFILE"
            else
              DOCKER_BUILD_CONTEXT="$GITHUB_WORKSPACE/$BUILD_CONTEXT"
              DOCKERFILE_PATH="$DOCKER_BUILD_CONTEXT/$DOCKERFILE_PATH"
            fi
            [ -d "$DOCKER_BUILD_CONTEXT" ] || { echo "Component repository install root does not exist: $COMPONENT_ID." >&2; exit 1; }
            cd "$GITHUB_WORKSPACE/$BUILD_CONTEXT"
            BUILD_SECRET_ARGS=()
            BUILD_ARGS=()
            if [ "$(printf '%s' "$component" | jq -r '.dockerStrategy == "generated"')" = "true" ]; then
              if grep -q 'id=deployguard_public_build_config' Dockerfile && [ -n "$CONFIG_FILE" ]; then
