name: Publish DeployGuard team runtime images

on:
  push:
    branches: [test2]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/deployguard-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/deployguard-frontend

jobs:
  publish:
    name: Build and publish portable runtime images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate backend runtime tools
        if: matrix.component == 'backend'
        shell: bash
        run: |
          set -euo pipefail
          docker build --file backend/Dockerfile --tag deployguard-backend:validation .
          docker run --rm --entrypoint /bin/sh deployguard-backend:validation -ec '
            terraform version
            aws --version
            git --version
            docker --version
            curl --version
            infracost --version
          '

      - name: Build, smoke-test, and push backend
        if: matrix.component == 'backend'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:fyp-demo-1

      - name: Validate frontend health endpoint
        if: matrix.component == 'frontend'
        shell: bash
        run: |
          set -euo pipefail
          docker build --file frontend/Dockerfile --tag deployguard-frontend:validation .
          docker network create deployguard-image-validation
          cleanup() { docker rm -f deployguard-frontend-validation deployguard-backend-validation >/dev/null 2>&1 || true; docker network rm deployguard-image-validation >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name deployguard-backend-validation --network deployguard-image-validation --network-alias backend nginx:1.27-alpine
          docker run -d --name deployguard-frontend-validation --network deployguard-image-validation -p 18080:8080 deployguard-frontend:validation
          for attempt in $(seq 1 30); do curl --fail --silent --show-error http://127.0.0.1:18080/healthz && exit 0; sleep 1; done
          docker logs deployguard-frontend-validation >&2
          exit 1

      - name: Build, smoke-test, and push frontend
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:fyp-demo-1

      - name: Report immutable image tag
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.component }}' = backend ]; then image="$BACKEND_IMAGE"; else image="$FRONTEND_IMAGE"; fi
          echo "Published ${image}:${GITHUB_SHA}"
