name: deploy-guard-dev

services:
  postgres:
    image: postgres:16.9-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-${DATABASE_NAME:-mini_paas}}
      POSTGRES_USER: ${POSTGRES_USER:-${DATABASE_USERNAME:-mini_paas_user}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DATABASE_PASSWORD:?Set POSTGRES_PASSWORD or DATABASE_PASSWORD}}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: ${DEPLOYGUARD_IMAGE_NAMESPACE:-deployguard}/deployguard-backend:${DEPLOYGUARD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment: &backend-environment
      NODE_ENV: development
      PORT: 5000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${POSTGRES_USER:-${DATABASE_USERNAME:-mini_paas_user}}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-${DATABASE_PASSWORD:?Set POSTGRES_PASSWORD or DATABASE_PASSWORD}}
      DATABASE_NAME: ${POSTGRES_DB:-${DATABASE_NAME:-mini_paas}}
      DATABASE_SSL: "false"
      TYPEORM_SYNCHRONIZE: "false"
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      BACKEND_URL: http://localhost:${BACKEND_PORT:-5000}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:5173/api/auth/github/callback}
      PROMETHEUS_BASE_URL: http://prometheus:9090
      GRAFANA_INTERNAL_URL: http://grafana:3000
      GRAFANA_BASE_URL: http://localhost:${GRAFANA_PORT:-3001}/d/deployguard-runtime/deployguard-runtime
      TERRAFORM_WORKING_BASE_DIR: /app/backend/.deployguard/terraform-workspaces
      TERRAFORM_NETWORK_TEMPLATE_DIR: /app/backend/terraform/base-network
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/src/data-source.docker.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${DEPLOYGUARD_IMAGE_NAMESPACE:-deployguard}/deployguard-backend:${DEPLOYGUARD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      <<: *backend-environment
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - deployguard_workspaces:/app/backend/.deployguard
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ${DEPLOYGUARD_IMAGE_NAMESPACE:-deployguard}/deployguard-frontend:${DEPLOYGUARD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        escaped=$$(printf '%s' "$$PROMETHEUS_SCRAPE_TOKEN" | sed 's/[\\&|]/\\&/g')
        target=$$(printf '%s' "$$PROMETHEUS_SCRAPE_TARGET" | sed 's/[\\&|]/\\&/g')
        sed -e "s|__DEPLOYGUARD_SCRAPE_TOKEN__|$$escaped|g" -e "s|__DEPLOYGUARD_SCRAPE_TARGET__|$$target|g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d
    environment:
      PROMETHEUS_SCRAPE_TOKEN: ${PROMETHEUS_SCRAPE_TOKEN:-deployguard-local-monitoring}
      # product:start runs the API on the host against backend/.env's
      # authoritative PostgreSQL endpoint; Compose supplies monitoring only.
      PROMETHEUS_SCRAPE_TARGET: ${PROMETHEUS_SCRAPE_TARGET:-host.docker.internal:5000}
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.compose.yml:/etc/prometheus/prometheus.yml.template:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-deployguard-local-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  deployguard_workspaces:
