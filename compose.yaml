name: deployguard

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: "5000"
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env.container}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.container}
  DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env.container}
  DATABASE_SSL: "false"
  TYPEORM_SYNCHRONIZE: "false"
  FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
  BACKEND_URL: http://localhost:${BACKEND_PORT:-5000}
  GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:5173/api/auth/github/callback}
  PROMETHEUS_BASE_URL: http://prometheus:9090
  PROMETHEUS_SCRAPE_TOKEN: ${PROMETHEUS_SCRAPE_TOKEN:?Set PROMETHEUS_SCRAPE_TOKEN in .env.container}
  GRAFANA_INTERNAL_URL: http://grafana:3000
  GRAFANA_BASE_URL: http://localhost:${GRAFANA_PORT:-3001}/d/deployguard-runtime/deployguard-runtime
  TERRAFORM_WORKING_BASE_DIR: /app/backend/.deployguard/terraform-workspaces
  TERRAFORM_NETWORK_TEMPLATE_DIR: /app/backend/terraform/base-network

services:
  postgres:
    image: ${DEPLOYGUARD_IMAGE_NAMESPACE:-deployguard-local}/postgres:${DEPLOYGUARD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.container}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.container}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.container}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./transfer-data:/transfer:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: ${DEPLOYGUARD_IMAGE_NAMESPACE:-deployguard-local}/backend:${DEPLOYGUARD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.container
    environment: *backend-environment
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/src/data-source.docker.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${DEPLOYGUARD_IMAGE_NAMESPACE:-deployguard-local}/backend:${DEPLOYGUARD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.container
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - deployguard_workspaces:/app/backend/.deployguard
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ${DEPLOYGUARD_IMAGE_NAMESPACE:-deployguard-local}/frontend:${DEPLOYGUARD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  prometheus:
    image: ${DEPLOYGUARD_IMAGE_NAMESPACE:-deployguard-local}/prometheus:${DEPLOYGUARD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: monitoring/prometheus.Dockerfile
    environment:
      PROMETHEUS_SCRAPE_TOKEN: ${PROMETHEUS_SCRAPE_TOKEN:?Set PROMETHEUS_SCRAPE_TOKEN in .env.container}
      PROMETHEUS_SCRAPE_TARGET: backend:5000
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  grafana:
    image: ${DEPLOYGUARD_IMAGE_NAMESPACE:-deployguard-local}/grafana:${DEPLOYGUARD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: monitoring/grafana.Dockerfile
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env.container}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.container}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  deployguard_workspaces:
